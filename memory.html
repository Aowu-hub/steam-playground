<style>
  /* Memories Match keeps its own look; each deck brings its own card backs. */

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  .section-head{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.05rem;margin:18px 0 10px;color:var(--ink-soft);text-align:center;}
  .themes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}

  .rules li{margin:5px 0;font-size:0.9rem;}
  @media (max-width:640px){ .levels{grid-template-columns:repeat(2,1fr);} .levels .lvl:last-child{grid-column:1 / -1;} .themes{grid-template-columns:repeat(2,1fr);} .title h1{font-size:1.6rem;} }

  .hc-note{background:linear-gradient(135deg,#7A1020,#2E0609);color:#FFECEC;border-radius:14px;padding:10px 12px;font-weight:800;font-size:0.9rem;}

  /* ---------- play ---------- */

  .pill.warn{background:var(--danger);animation:pulse .8s ease-in-out infinite;} @keyframes pulse{50%{transform:scale(1.08);}}

    background:rgba(25,10,45,0.85);color:#fff;border-radius:14px;padding:8px 14px;font-family:'Fredoka',sans-serif;font-weight:700;opacity:0;transition:opacity .25s;}
  .banner.on{opacity:1;} .banner.gold{background:linear-gradient(135deg,#FF9F1C,#FF4D8D);} .banner.bad{background:rgba(229,72,77,0.95);}
  .praise{position:absolute;left:50%;top:40%;z-index:30;transform:translate(-50%,-50%);pointer-events:none;text-align:center;white-space:nowrap;font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.4rem,5vw,2.6rem);color:#fff;
    padding:12px 22px;border-radius:22px;background:linear-gradient(135deg,#9B5DE5,#2EC4B6,#6B3BE0);box-shadow:0 8px 0 rgba(0,0,0,0.25);animation:praise-in .7s cubic-bezier(.2,1.6,.4,1) both;}
  @keyframes praise-in{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0;}100%{transform:translate(-50%,-50%) scale(1);opacity:1;}}
  @media (pointer:fine) and (min-width:900px){ .pad{opacity:.75;} }
  /* keys sheet + result */
  .sheet{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(25,10,45,0.6);}
  .sheet-card{background:var(--card);color:var(--ink);border-radius:24px;padding:18px;max-width:360px;width:100%;}
  .krow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--panel);font-weight:800;} .krow span{flex:1;}
  .keybtn{border:2px solid #9B5DE5;background:#fff;border-radius:9px;padding:4px 10px;min-width:60px;cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:700;color:#6B2FB3;}
  .keybtn.wait{background:var(--gold);border-color:var(--gold);color:#3A2500;}
  .result{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(25,10,45,0.6);overflow-y:auto;}
  .result{flex-direction:column;justify-content:flex-start;} .result::after{content:'';flex:0 0 var(--safe-b, 18px);}   /* bottom headroom: buttons stay above the phone's swipe-up bar */
  .result-card{margin:auto;background:var(--card);color:var(--ink);border-radius:26px;padding:24px 22px;max-width:390px;width:100%;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,0.35);display:flex;flex-direction:column;gap:10px;align-items:center;}
  .result-card .big{font-size:3.4rem;} .result-card h2{font-size:1.55rem;}
  .result-card h2.cheer{background:linear-gradient(90deg,#9B5DE5,#2EC4B6,#6B3BE0);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .rating .st{font-size:2rem;display:inline-block;animation:star-pop .5s cubic-bezier(.2,1.8,.4,1) both;} .rating .st.off{filter:grayscale(1);opacity:.25;}
  @keyframes star-pop{0%{transform:scale(0) rotate(-40deg);}100%{transform:scale(1);}}
  .score-big{font-family:'Fredoka',sans-serif;font-weight:700;font-size:2rem;color:#6B2FB3;}
  .stats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;} .stats span{background:var(--panel);border-radius:10px;padding:4px 10px;font-weight:800;font-size:0.82rem;}
  .save-note{font-weight:800;font-size:0.85rem;color:var(--ink-soft);}
  .new-badge,.title-new,.feat-new{display:inline-block;background:linear-gradient(135deg,#FFC845,#FF9F1C);color:#3A2500;border-radius:10px;padding:4px 10px;font-weight:800;margin:2px;}
  .res-btns > #b-menu, .res-btns > #tg-x, .res-btns > #btn-levels, .res-btns > #btn-hc-levels{order:-1;} .res-btns > #b-next, .res-btns > #btn-next{order:2;}   /* 🔘 p1b: exit left, main action right */
  .res-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .confetti{position:fixed;top:-40px;z-index:390;font-size:1.6rem;pointer-events:none;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);}}
  .empty{text-align:center;color:var(--ink-soft);font-weight:800;padding:20px;}
  .title .logo{font-size:2.8rem;animation:flipcard 2.2s ease-in-out infinite;}
  @keyframes flipcard{0%,40%{transform:perspective(300px) rotateY(0);}60%,100%{transform:perspective(300px) rotateY(360deg);}}
  /* play */
  .hud .pill.turn{background:var(--seat, #9B5DE5);}
  .arena{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 12px var(--safe-b, 18px);}
  .board{display:grid;gap:var(--gap,8px);touch-action:manipulation;}
  .side{display:flex;flex-direction:column;gap:8px;min-width:170px;max-width:220px;}
  .pl{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.12);border:3px solid transparent;border-radius:16px;padding:6px 10px;color:#fff;transition:transform .25s, background .25s;}
  .pl canvas{width:40px;height:47px;flex:none;} .pl .nm{font-weight:800;font-size:0.9rem;line-height:1.1;} .pl .sc{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.25rem;margin-left:auto;}
  .pl .pile{font-size:0.75rem;opacity:.85;}
  .pl.now{border-color:var(--seat);background:rgba(255,255,255,0.22);transform:scale(1.04);}
  .pl.win .nm::after{content:' 👑';}
  .pl .mine{display:flex;flex-wrap:wrap;gap:1px;font-size:0.8rem;line-height:1;margin-top:2px;max-width:120px;} .pl .mine i{font-style:normal;border-bottom:2px solid var(--seat);padding:0 1px;}
  /* 👉 turn card (2–4 players): the next player's avatar waves, then it fades away by itself (never blocks the cards) */
  .turncard{position:absolute;left:50%;top:50%;z-index:25;pointer-events:none;transform:translate(-50%,-50%) scale(.85);opacity:0;transition:opacity .25s, transform .25s;
    background:rgba(255,255,255,0.95);color:#2A1E44;border-radius:24px;padding:10px 22px 14px;text-align:center;border:5px solid var(--seat,#9B5DE5);box-shadow:0 14px 40px rgba(0,0,0,0.35);}
  .turncard.on{opacity:1;transform:translate(-50%,-50%) scale(1);} .turncard canvas{width:110px;height:128px;display:block;margin:0 auto;}
  .turncard b{display:block;font-family:'Fredoka',sans-serif;font-size:1.5rem;} .turncard small{font-weight:800;color:#6B5A8E;}
  @media (max-width:820px), (max-height:500px) and (orientation:landscape){
    .arena{flex-direction:column;gap:8px;} .side{flex-direction:row;max-width:none;min-width:0;width:100%;justify-content:center;flex-wrap:wrap;}
    .pl{padding:4px 8px;} .pl canvas{width:30px;height:35px;} .pl .sc{font-size:1.05rem;}
  }
  @media (max-height:500px) and (orientation:landscape){ .arena{flex-direction:row;} .side{flex-direction:column;width:auto;max-width:150px;} }
  .card{position:relative;width:var(--cs);height:var(--cs);perspective:600px;border:none;padding:0;background:none;cursor:pointer;border-radius:calc(var(--cs) * 0.16);}
  .card:focus-visible{outline:3px solid #FFC845;outline-offset:3px;}
  .card.cursor{outline:3px dashed #FFC845;outline-offset:3px;}
  .card .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .38s cubic-bezier(.3,1.4,.5,1);}
  .card.up .in, .card.done .in{transform:rotateY(180deg);}
  .card .face{position:absolute;inset:0;border-radius:inherit;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,0.25);}
  .card .back{background:var(--deck-back);color:rgba(255,255,255,0.9);font-size:calc(var(--cs) * 0.42);overflow:hidden;}
  .card .back::before{content:'';position:absolute;inset:calc(var(--cs) * 0.07);border:2px dashed rgba(255,255,255,0.45);border-radius:calc(var(--cs) * 0.1);}
  .card .front{background:#FFFFFF;transform:rotateY(180deg);font-size:calc(var(--cs) * 0.6);line-height:1;}
  .card.done .front{background:var(--won, #FFF4C2);box-shadow:0 0 0 3px var(--won-edge, #FFC845), 0 4px 0 rgba(0,0,0,0.2);}
  .card.done{animation:matched .6s ease;cursor:default;}
  @keyframes matched{0%{transform:scale(1);}35%{transform:scale(1.18) rotate(-6deg);}65%{transform:scale(0.95) rotate(4deg);}100%{transform:scale(1);}}
  .card.miss{animation:miss .45s ease;}
  @keyframes miss{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px) rotate(-4deg);}40%{transform:translateX(7px) rotate(4deg);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
  .card.swap{animation:swapglow 1.2s ease;}
  @keyframes swapglow{0%,100%{filter:none;}30%,70%{filter:drop-shadow(0 0 10px #FFC845) brightness(1.2);}}
  .spark{position:fixed;z-index:50;pointer-events:none;font-size:1.3rem;animation:spark .8s ease-out forwards;}
  @keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0;}}
  .peek{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:20;background:rgba(25,10,45,0.85);color:#fff;border-radius:14px;padding:8px 14px;font-family:'Fredoka',sans-serif;font-weight:700;}
  .podium{display:flex;flex-direction:column;gap:6px;width:100%;}
  .podium div{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:12px;padding:6px 10px;font-weight:800;}
  .podium b{margin-left:auto;font-family:'Fredoka',sans-serif;}
  .box{background:var(--card);border-radius:22px;padding:12px 14px;box-shadow:0 5px 0 rgba(0,0,0,0.07);max-width:920px;margin:0 auto;}
  .box h3{font-size:0.98rem;margin:2px 0 10px;color:var(--ink-soft);}
  .deck{border:3px solid transparent;border-radius:18px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--panel);color:var(--ink);font-family:inherit;}
  .deck .nm{font-family:'Fredoka',sans-serif;font-weight:700;}
  /* ---------- 🃏 mm-1: Memories Match — one setup page (map → level → options → ▶ Start) ---------- */
  .who{flex-wrap:wrap;justify-content:center;}
  .who canvas{width:30px;height:35px;}
  .maps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .mapc .grid{display:grid;gap:2px;width:58px;height:58px;padding:4px;border-radius:10px;background:linear-gradient(135deg,#9B5DE5,#F15BB5);}
  .mapc .grid i{border-radius:2px;background:rgba(255,255,255,.9);}
  .mapc .pairs{font-size:.74rem;font-weight:800;color:var(--ink-soft);}
  .mapc .mult{font-size:.7rem;font-weight:800;background:var(--panel);border-radius:10px;padding:2px 8px;}
  .modes{grid-template-columns:repeat(2,1fr);max-width:620px;margin:0 auto;}
  .modec .big{font-size:2rem;} .modec.off{opacity:.55;}
  .mapc.big .grid{background:linear-gradient(135deg,#FF8A3D,#E5484D);}

  .deck{position:relative;}

  .deck .mini{font-size:1.15rem;}
  @media (max-width:640px){ .maps{grid-template-columns:repeat(2,1fr);} .decks{grid-template-columns:repeat(2,1fr);} }
  .b2-start{position:sticky;bottom:0;z-index:5;display:flex;justify-content:center;padding:10px 0 calc(var(--safe-b, 12px) + 4px);margin-top:14px;background:linear-gradient(transparent,#F7F1FF 35%);}
  .b2-start .sp-btn{min-width:min(440px,92%);min-height:56px;font-size:1.12rem;}
