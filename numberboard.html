<style>
  /* Algebros: a crossword of number sentences (equations) with number + sign tiles.
     1 player vs the robot (6 levels) or 2–4 players on one device. Menus follow the player's look; the play screen wears the board theme. */
  :root{
    --bg:#2F2A1E; --card:#FFFFFF; --panel:#FFF3E0; --ink:#3B2A20; --ink-soft:#8A6F5C;
    --pink:#FF6B8B; --violet:#7A5CFA; --gold:#FFC845; --mint:#2EC4B6; --green:#4CB963; --danger:#E5484D;
    --terracotta:#E07A3F; --mustard:#FFC845; --dusty-blue:#8A6F5C; /* used by UiKit */
    --t1:#F5E6CC; --t2:#E2C79A; --board:#C89B62; --cell:#EBD3A8; --tile:#FFF3D6; --tink:#4A2E12;
    --p2t:#8FD0F5; --p3t:#3D7DD8; --p2e:#F7B2BE; --p3e:#E5484D; --cs:30px;
  }
  html{height:100%;background:#FFF7EE;}
  body{margin:0;min-height:100%;min-height:100dvh;background:#FFF7EE;color:var(--ink);font-family:'Nunito',sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overscroll-behavior:none;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  .hidden{display:none !important;}
  h1,h2,h3{font-family:'Fredoka',sans-serif;margin:0;}
  button{font-family:inherit;}
  .top-btn{position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));z-index:300;
    border:none;border-radius:14px;background:var(--card);color:var(--ink-soft);cursor:pointer;padding:8px 12px;min-height:38px;
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:0.82rem;box-shadow:0 3px 0 rgba(0,0,0,0.08);}
  /* ---------- menus ---------- */
  .screen{max-width:960px;margin:0 auto;padding:62px 18px 40px;padding-bottom:calc(40px + var(--safe-b, 18px));}
  .title{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;margin-bottom:12px;}
  .title h1{font-size:2rem;} .title p{margin:0;color:var(--ink-soft);font-weight:700;}
  .title .logo{font-size:2.8rem;animation:nblogo 2.6s ease-in-out infinite;}
  @keyframes nblogo{0%,100%{transform:rotate(-6deg) scale(1);}50%{transform:rotate(6deg) scale(1.08);}}
  .who{display:inline-flex;align-items:center;gap:8px;margin-top:6px;background:var(--card);border-radius:14px;padding:6px 12px;font-weight:800;font-size:0.85rem;}
  .who button{border:none;background:none;color:color-mix(in srgb, var(--pink) 70%, var(--ink));font-weight:800;cursor:pointer;font-size:inherit;text-decoration:underline;padding:6px 8px;min-height:34px;}
  .pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;}
  .pick{background:var(--card);border:3px solid transparent;border-radius:20px;padding:14px 10px;cursor:pointer;position:relative;
    display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,0.07);color:inherit;}
  .pick:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,0.07);}
  .pick .big{font-size:2.2rem;line-height:1;} .pick .nm{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1rem;} .pick .sub{font-size:0.75rem;color:var(--ink-soft);font-weight:700;}
  .pick canvas{width:72px;height:84px;}
  .section-head{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.05rem;margin:16px 0 8px;color:var(--ink-soft);text-align:center;}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .chip{border:3px solid transparent;border-radius:16px;background:var(--card);color:var(--ink);cursor:pointer;padding:8px 10px;min-width:104px;min-height:44px;
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:0.92rem;display:inline-flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 4px 0 rgba(0,0,0,0.07);}
  .chip .ic{font-size:1.25rem;line-height:1;letter-spacing:1px;white-space:nowrap;}
  .chip.on{border-color:var(--pink);background:#FF4D8D;color:#fff;}
  /* the picked look must stay visible in every app look (looks restyle cards and chips) */
  html .chip.on, html [data-theme] .chip.on, html .chip.on.t-card{background:linear-gradient(135deg,#FF4D8D,#FF8A3D) !important;color:#fff !important;border-color:#FFE066 !important;box-shadow:0 0 0 3px rgba(255,224,102,0.55),0 4px 0 rgba(0,0,0,0.2) !important;position:relative;}
  html .chip.on *{color:#fff !important;}
  /* iPad Safari inside the Apps Script frame sometimes skips repainting a chip whose class changed: each chip + level card gets its own layer */
  .chips, .chip, .levels .lvl{transform:translateZ(0);-webkit-transform:translateZ(0);backface-visibility:hidden;-webkit-backface-visibility:hidden;}
  .chip.pick:active, .levels .lvl.pick:active, .chip:active{transform:translateZ(0) translateY(4px);}
  .chip.on::after{content:'✓';position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#2EC4B6;color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,0.2);}
  @media (max-width:640px){ .chips{padding:4px 2px 2px;gap:6px;} .chip{flex:0 1 auto;min-width:0;padding:6px 9px;} }   /* 📏 p2: chips wrap (pages with dots when long), never a sideways row */
  .levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media (min-width:1100px){ .levels{grid-template-columns:repeat(6,1fr);} }
  @media (max-width:640px){ .levels{grid-template-columns:repeat(2,1fr);} .title h1{font-size:1.5rem;} }
  .lvl .num{position:absolute;top:8px;left:10px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:0.75rem;color:var(--ink-soft);}
  .lvl .badge{position:absolute;top:6px;right:8px;font-size:1rem;}
  .lvl.recommended{border-color:var(--mint);}
  .lvl.recommended::after{content:'Great for you!';position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--mint);color:#fff;font-size:0.62rem;font-weight:800;padding:2px 8px;border-radius:8px;}
  .lvl.locked{opacity:.55;cursor:not-allowed;filter:grayscale(.6);}
  .lvl .learn{font-size:0.72rem;font-weight:800;color:color-mix(in srgb, var(--pink) 70%, var(--ink));}
  .lvl .lives{font-size:0.66rem;font-weight:800;background:var(--panel);border-radius:10px;padding:2px 6px;}
  .lvl .best{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 8px;font-size:0.74rem;font-weight:800;}
  .lvl .best span{background:var(--panel);border-radius:10px;padding:2px 8px;} .lvl .best.none{color:var(--ink-soft);}
  .lvl .eq{font-family:'Fredoka',sans-serif;font-weight:700;font-size:0.85rem;letter-spacing:1px;}
  .lvl.hardcore{background:linear-gradient(160deg,#7A1020 0%,#2E0609 62%,#0E0204 100%) !important;color:#FFECEC !important;border-color:#FF4040 !important;}
  .lvl.hardcore .nm,.lvl.hardcore .sub,.lvl.hardcore .num,.lvl.hardcore .learn,.lvl.hardcore .lives,.lvl.hardcore .best,.lvl.hardcore .best.none,.lvl.hardcore .eq{color:#FFECEC !important;}
  .lvl.hardcore .best span,.lvl.hardcore .lives{background:rgba(255,255,255,0.16) !important;color:#FFECEC !important;}
  .lvl.hardcore .big{filter:drop-shadow(0 0 8px rgba(255,64,64,0.85));}
  .lvl.hardcore:not(.locked){box-shadow:0 0 0 2px #FF4040,0 0 18px rgba(255,64,64,0.45) !important;}
  .lvl.hardcore.locked{opacity:.8;filter:grayscale(.3);}
  .lvl.together{background:linear-gradient(135deg,#2E7D5B,#2EC4B6) !important;color:#fff !important;grid-column:1 / -1;border-color:#B7F5E3 !important;}
  .lvl.together *{color:#fff !important;} .lvl.together .lives{background:rgba(255,255,255,0.2) !important;}
  .rules{background:var(--card);border-radius:18px;padding:8px 14px;margin-top:16px;}
  .rules summary{cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:700;padding:6px 0;min-height:34px;}
  .rules li{margin:5px 0;font-size:0.9rem;}
  .empty{text-align:center;color:var(--ink-soft);font-weight:800;padding:20px;}

  /* ---------- play ---------- */
  #scr-play{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--t1),var(--t2));color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;}
  #scr-play.dark{color:#fff;}
  .pill{background:rgba(0,0,0,0.32);border:none;color:#fff;border-radius:14px;padding:6px 10px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:0.88rem;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;flex:none;}
  button.pill{cursor:pointer;min-width:40px;min-height:38px;justify-content:center;} button.pill:active{transform:translateY(2px);}
  .pill.lvl-pill{background:linear-gradient(135deg,#E07A3F,#FF6B8B);} .pill.lvl-pill.hc{background:linear-gradient(135deg,#B3122B,#3A0A10);} .pill.lvl-pill.tg{background:linear-gradient(135deg,#2E7D5B,#2EC4B6);}
  .scores{display:flex;gap:6px;flex:none;}
  .sc{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,0.85);color:#3B2A20;border-radius:14px;padding:3px 10px 3px 4px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:0.9rem;border:2px solid transparent;}
  .sc canvas{width:26px;height:30px;} .sc .bot{font-size:1.3rem;line-height:1;} .sc b{font-size:1rem;}
  .sc.cur{border-color:#FFC845;box-shadow:0 0 0 3px rgba(255,200,69,0.5);}
  .arena{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 10px var(--safe-b, 18px);position:relative;}
  .board-wrap{flex:none;max-width:100%;max-height:100%;overflow:auto;border-radius:14px;scrollbar-width:thin;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  .board{display:grid;gap:2px;padding:5px;background:var(--board);border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,0.18);width:max-content;}
  .cell{width:var(--cs);height:var(--cs);border-radius:max(3px, calc(var(--cs) * 0.16));background:var(--cell);position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-family:'Fredoka',sans-serif;font-weight:700;color:rgba(0,0,0,0.42);font-size:calc(var(--cs) * 0.3);line-height:1;}
  .cell.p2t{background:var(--p2t);} .cell.p3t{background:var(--p3t);color:rgba(255,255,255,0.8);} .cell.p2e{background:var(--p2e);} .cell.p3e{background:var(--p3e);color:rgba(255,255,255,0.85);}
  .cell .pl{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.95;pointer-events:none;} .cell .pl b{font-size:calc(var(--cs) * 0.3);} .cell .pl i{font-style:normal;font-size:max(6px, calc(var(--cs) * 0.19));text-transform:uppercase;letter-spacing:.2px;opacity:.9;}
  .cell.star{background:var(--p2e);font-size:calc(var(--cs) * 0.55);color:#B3122B;}
  .cell.cursor{box-shadow:inset 0 0 0 3px #FF4D8D;}
  .cell.cursor::after{content:attr(data-dir);position:absolute;font-size:calc(var(--cs) * 0.55);color:#FF4D8D;}
  .tile{position:absolute;inset:0;border-radius:inherit;background:var(--tile);color:var(--tink);display:flex;align-items:center;justify-content:center;
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:calc(var(--cs) * 0.56);box-shadow:inset 0 calc(var(--cs) * -0.09) 0 rgba(0,0,0,0.16);}
  .tile.w2{font-size:calc(var(--cs) * 0.46);letter-spacing:-1px;}
  .tile.op{color:#B3122B;}
  .tile .pt{position:absolute;right:max(1px, calc(var(--cs) * 0.06));bottom:max(0px, calc(var(--cs) * 0.04));font-size:calc(var(--cs) * 0.24);opacity:.75;letter-spacing:0;}
  .tile.blank{background:repeating-linear-gradient(45deg,var(--tile),var(--tile) 4px,#ffffff 4px,#ffffff 8px);}
  .tile.pend{background:#FFE36E;box-shadow:0 0 0 2px #FF9F1C, inset 0 calc(var(--cs) * -0.09) 0 rgba(0,0,0,0.16);animation:pend-in .18s ease both;}
  .tile.pend.good{background:#B8F5C8;box-shadow:0 0 0 2px #2EA44F, inset 0 calc(var(--cs) * -0.09) 0 rgba(0,0,0,0.16);}
  .tile.pend.bad{background:#FFC9C9;box-shadow:0 0 0 2px #E5484D, inset 0 calc(var(--cs) * -0.09) 0 rgba(0,0,0,0.16);}
  .tile.last{box-shadow:0 0 0 2px #FF4D8D, inset 0 calc(var(--cs) * -0.09) 0 rgba(0,0,0,0.16);}
  .tile.ghost{opacity:.75;background:#D9CCFF;box-shadow:0 0 0 2px #7A5CFA;animation:ghost 1s ease-in-out infinite;}
  .tile.drop{animation:drop .32s cubic-bezier(.2,1.6,.4,1) both;}
  @keyframes pend-in{0%{transform:scale(.6);}100%{transform:scale(1);}}
  @keyframes drop{0%{transform:translateY(-60%) scale(1.3);opacity:0;}100%{transform:none;opacity:1;}}
  @keyframes ghost{0%,100%{opacity:.45;}50%{opacity:.9;}}
  .side{flex:none;display:flex;flex-direction:column;gap:8px;align-items:stretch;width:min(100%, 380px);}
  .msg{min-height:40px;border-radius:14px;background:rgba(255,255,255,0.85);color:#3B2A20;padding:8px 12px;font-weight:800;font-size:0.9rem;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;}
  .msg.good{background:#D9F7E2;color:#14532D;} .msg.bad{background:#FFE1E1;color:#7A1020;} .msg.bot{background:#E9E3FF;color:#2E1A7A;}
  .rack{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;padding:6px;border-radius:16px;background:rgba(0,0,0,0.22);}
  .rt{position:relative;aspect-ratio:1;min-height:38px;border:none;border-radius:10px;background:var(--tile);color:var(--tink);cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.3rem;
    box-shadow:0 4px 0 rgba(0,0,0,0.22);display:flex;align-items:center;justify-content:center;padding:0;transition:transform .12s;}
  .rt.op{color:#B3122B;} .rt.w2{font-size:1.05rem;letter-spacing:-1px;}
  .rt .pt{position:absolute;right:4px;bottom:2px;font-size:0.6rem;opacity:.7;}
  .rt.sel{transform:translateY(-6px);box-shadow:0 0 0 3px #FF4D8D,0 6px 0 rgba(0,0,0,0.22);}
  .rt.swap{box-shadow:0 0 0 3px #7A5CFA,0 4px 0 rgba(0,0,0,0.22);background:#E9E3FF;}
  .rt.used{visibility:hidden;}
  .rt.blank{background:repeating-linear-gradient(45deg,var(--tile),var(--tile) 5px,#ffffff 5px,#ffffff 10px);}
  .rt.hide{color:transparent !important;background:#8A6F5C !important;}
  .rt.hide .pt{display:none;}
  .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .act{border:none;border-radius:13px;background:rgba(255,255,255,0.9);color:#3B2A20;cursor:pointer;min-height:44px;padding:4px 2px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:0.8rem;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 3px 0 rgba(0,0,0,0.16);}
  .act .i{font-size:1.15rem;line-height:1;} .act:active{transform:translateY(2px);} .act:disabled{opacity:.4;cursor:default;}
  .act.play{background:linear-gradient(135deg,#2EA44F,#2EC4B6);color:#fff;grid-column:span 2;font-size:1rem;flex-direction:row;gap:6px;}
  .act.on{background:#7A5CFA;color:#fff;}
  .bagline{display:flex;justify-content:space-between;font-weight:800;font-size:0.8rem;opacity:.85;padding:0 4px;}
  .turnbar{text-align:center;font-family:'Fredoka',sans-serif;font-weight:700;font-size:0.95rem;}
  .think{display:inline-block;}
  /* phones held upright: board full width, rack + buttons under it, the arena scrolls if needed */
  @media (orientation:portrait), (max-width:759px){
    .arena{flex-direction:column;justify-content:flex-start;overflow-y:auto;overscroll-behavior:contain;gap:8px;}
    .side{width:min(100%, 560px);}
  }
  .banner{position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:20;pointer-events:none;width:max-content;max-width:min(92vw,460px);text-align:center;
    background:rgba(40,20,10,0.9);color:#fff;border-radius:14px;padding:8px 14px;font-family:'Fredoka',sans-serif;font-weight:700;opacity:0;transition:opacity .25s;}
  .banner.on{opacity:1;} .banner.gold{background:linear-gradient(135deg,#FF9F1C,#FF6B8B);} .banner.bad{background:rgba(229,72,77,0.95);} .banner.bot{background:linear-gradient(135deg,#5B4BE0,#7A5CFA);}
  .praise{position:fixed;left:50%;top:38%;z-index:30;transform:translate(-50%,-50%);pointer-events:none;text-align:center;white-space:nowrap;font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.4rem,5vw,2.6rem);color:#fff;
    padding:12px 22px;border-radius:22px;background:linear-gradient(135deg,#E07A3F,#FF6B8B,#7A5CFA);box-shadow:0 8px 0 rgba(0,0,0,0.25);animation:praise-in .7s cubic-bezier(.2,1.6,.4,1) both;}
  @keyframes praise-in{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0;}100%{transform:translate(-50%,-50%) scale(1);opacity:1;}}
  .float{position:fixed;z-index:60;pointer-events:none;font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.4rem;color:#FFC845;text-shadow:0 2px 0 rgba(0,0,0,0.35);animation:floatup 1s ease-out forwards;}
  @keyframes floatup{to{transform:translateY(-50px);opacity:0;}}
  /* pop-ups inside the play screen: blank picker, pass-the-device, play-together setup */
  .sheet{position:fixed;inset:0;z-index:350;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px;background:rgba(25,10,45,0.6);overflow-y:auto;}
  .sheet::after{content:'';flex:0 0 var(--safe-b, 18px);}
  .sheet-card{margin:auto;background:var(--card);color:var(--ink);border-radius:24px;padding:20px;max-width:440px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 18px 50px rgba(0,0,0,0.35);}
  .sheet-card h2{font-size:1.35rem;}
  .blank-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%;}
  .blank-grid button{min-height:44px;border:none;border-radius:10px;background:var(--panel);color:var(--ink);font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.15rem;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,0.12);}

// Bonus squares: '2t' / '3t' = tile ×2 / ×3, '2e' / '3e' = whole sentence ×2 / ×3, 'star' = the middle (sentence ×2).
function premLayout(N){

  Object.keys(M).forEach(k => M[k].forEach(([r, q]) => put(r, q, k)));

// The bag for a level (or a Play-together setup): lots of small numbers, some big tiles, signs, plenty of =.

  for(let v = 10; v <= cfg.nums; v++) add(String(v), cfg.nums <= 12 ? 2 : 1);

// Read a line of tiles as a number sentence. Returns {ok, msg, text, value}.
function readSentence(toks){

}
// × and ÷ first, then + and − (left to right). ÷ must come out even.
function evalSide(sd){
  const nums = [], ops = [];

  const v = [nums[0]], o = [];

    const b = nums[k + 1];

      const a = v.pop();
      if(ops[k] === '/'){ if(b === 0) return {ok: false, msg: 'You can\'t share by 0'}; if(a % b) return {ok: false, msg: a + ' ÷ ' + b + ' doesn\'t share out evenly'}; v.push(a / b); }

}

// Tiles on the board for a moment's check: board + pending (a map index → token).
function tokAt(i, extra){ if(extra && extra.has(i)) return extra.get(i); const c = G.cells[i]; return c ? c.as : null; }
function lineThrough(i, dir, extra){
  const N = G.N, r = (i / N) | 0, q = i % N, dr = dir === 'down' ? 1 : 0, dq = dir === 'across' ? 1 : 0;
  let a = 0; while(true){ const rr = r - (a + 1) * dr, qq = q - (a + 1) * dq; if(rr < 0 || qq < 0 || tokAt(rr * N + qq, extra) === null) break; a++; }
  const cells = []; for(let k = -a; ; k++){ const rr = r + k * dr, qq = q + k * dq; if(rr >= N || qq >= N || rr < 0 || qq < 0) break; const idx = rr * N + qq; if(tokAt(idx, extra) === null) break; cells.push(idx); }

}
// Check a move: pend = [{i, t (as played)}]. Returns {ok, msg, lines:[{cells,text}], score, bingo, dir}.
function judge(pend, rackSize){
  if(!pend.length) return {ok: false, msg: 'Put some tiles on the board first'};
  const N = G.N, extra = new Map(pend.map(p => [p.i, p.t])), rows = new Set(pend.map(p => (p.i / N) | 0)), cols = new Set(pend.map(p => p.i % N));
  if(rows.size > 1 && cols.size > 1) return {ok: false, msg: 'New tiles must be in one line (across or down)'};
  let dir = rows.size === 1 && pend.length > 1 ? 'across' : cols.size === 1 && pend.length > 1 ? 'down' : null;
  if(!dir) dir = lineThrough(pend[0].i, 'across', extra).length >= lineThrough(pend[0].i, 'down', extra).length ? 'across' : 'down';
  const main = lineThrough(pend[0].i, dir, extra);
  if(pend.some(p => main.indexOf(p.i) < 0)) return {ok: false, msg: 'Leave no gaps between your tiles'};
  const empty = G.cells.every(c => !c), c = (N - 1) / 2, mid = c * N + c;
  if(empty){ if(!extra.has(mid)) return {ok: false, msg: 'The first sentence must go over the ⭐'}; }
  else {
    const touches = pend.some(p => { const r = (p.i / N) | 0, q = p.i % N; return [[r - 1, q], [r + 1, q], [r, q - 1], [r, q + 1]].some(([a, b]) => a >= 0 && b >= 0 && a < N && b < N && G.cells[a * N + b]); });
    if(!touches) return {ok: false, msg: 'Join your sentence to a tile on the board'};
  }
  if(main.length < 3) return {ok: false, msg: 'A sentence needs at least 3 tiles, like 4 = 4'};
  const lines = [main];
  pend.forEach(p => { const cross = lineThrough(p.i, dir === 'across' ? 'down' : 'across', extra); if(cross.length > 1) lines.push(cross); });
  const out = []; let score = 0;
  for(const ln of lines){
    const res = readSentence(ln.map(i => extra.has(i) ? extra.get(i) : G.cells[i].as));
    if(!res.ok) return {ok: false, msg: (lines.length > 1 && ln !== main ? 'Crossing line: ' : '') + res.msg, text: res.text, cells: ln};
    let s = 0, mult = 1;
    ln.forEach(i => { const isNew = extra.has(i), pt = isNew ? (pend.find(p => p.i === i).blank ? 0 : (PTS[extra.get(i)] || 0)) : G.cells[i].pts, pr = isNew ? G.prem[i] : '';
      s += pt * (pr === '2t' ? 2 : pr === '3t' ? 3 : 1); if(pr === '2e' || pr === 'star') mult *= 2; if(pr === '3e') mult *= 3; });
    s *= mult; score += s; out.push({cells: ln, text: res.text, score: s});
  }
  const bingo = pend.length >= RACK && rackSize >= RACK;
  if(bingo) score += BINGO;
  return {ok: true, lines: out, score, bingo, dir, text: out[0].text};
}

/* ---------- robot: finds sentences it can make through tiles on the board ---------- */
let EQ_CACHE = {key: '', list: []};
function numForms(v, cfg){ const out = [String(v).split('')]; if(v >= 10 && v <= cfg.nums) out.push([String(v)]); return out; }
function equationList(cfg){
  const key = cfg.nums + ':' + cfg.ops.join('');
  if(EQ_CACHE.key === key) return EQ_CACHE.list;
  const list = [], seen = new Set(), A = cfg.nums;
  const push = toks => { if(toks.length > 9) return; const k = toks.join(' '); if(seen.has(k)) return; seen.add(k); list.push(toks); };
  for(let a = 0; a <= A; a++){
    numForms(a, cfg).forEach(fa => push(fa.concat(['='], fa)));
    for(let b = 0; b <= A; b++) cfg.ops.forEach(op => {
      let c;
      if(op === '+') c = a + b; else if(op === '-') { c = a - b; if(c < 0) return; } else if(op === '*') c = a * b; else { if(!b || a % b) return; c = a / b; }
      if(c > 99) return;
      numForms(a, cfg).forEach(fa => numForms(b, cfg).forEach(fb => numForms(c, cfg).forEach(fc => {
        push(fa.concat([op], fb, ['='], fc)); push(fc.concat(['='], fa, [op], fb));
      })));
    });
  }
  EQ_CACHE = {key, list};
  return list;
}
// All moves for a rack (capped). Each move = {pend:[{i,t,blank,id}], score, text}.
function findMoves(rack, limitMs){
  const t0 = performance.now(), N = G.N, cfg = G.cfg, list = equationList(cfg), moves = [], seen = new Set();
  const count = {}; let blanks = 0; rack.forEach(x => { if(x.t === '?') blanks++; else count[x.t] = (count[x.t] || 0) + 1; });
  const empty = G.cells.every(c => !c), mid = ((N - 1) / 2) * N + (N - 1) / 2;
  const at = {}; G.cells.forEach((c, i) => { if(c) (at[c.as] = at[c.as] || []).push(i); });
  const tryPlace = (eq, start, dir) => {
    const dr = dir === 'down' ? N : 1, r0 = (start / N) | 0, q0 = start % N;
    if(start < 0 || start >= N * N) return;
    const rEnd = dir === 'down' ? r0 + eq.length - 1 : r0, qEnd = dir === 'across' ? q0 + eq.length - 1 : q0;
    if(rEnd >= N || qEnd >= N) return;
    const before = dir === 'down' ? (r0 > 0 ? start - N : -1) : (q0 > 0 ? start - 1 : -1), after = dir === 'down' ? (rEnd < N - 1 ? start + eq.length * N : -1) : (qEnd < N - 1 ? start + eq.length : -1);
    if((before >= 0 && G.cells[before]) || (after >= 0 && G.cells[after])) return;
    const use = Object.assign({}, count); let bl = blanks; const pend = [];
    for(let k = 0; k < eq.length; k++){
      const i = start + k * dr, c = G.cells[i];
      if(c){ if(c.as !== eq[k]) return; continue; }
      if(use[eq[k]] > 0) { use[eq[k]]--; pend.push({i, t: eq[k], blank: false}); }
      else if(bl > 0){ bl--; pend.push({i, t: eq[k], blank: true}); }
      else return;
    }
    if(!pend.length || (!empty && pend.length === eq.length)) return;
    const key = pend.map(p => p.i + p.t).join(','); if(seen.has(key)) return; seen.add(key);
    const j = judge(pend, rack.length); if(!j.ok) return;
    moves.push({pend, score: j.score, text: j.text, bingo: j.bingo});
  };
  for(let e = 0; e < list.length; e++){
    if((e & 255) === 0 && performance.now() - t0 > (limitMs || 900)) break;
    const eq = list[e];
    let missing = 0; const need = {}; eq.forEach(t => { need[t] = (need[t] || 0) + 1; });
    Object.keys(need).forEach(t => { missing += Math.max(0, need[t] - (count[t] || 0)); });
    if(missing > blanks + (empty ? 0 : 3)) continue;
    if(empty){ ['across', 'down'].forEach(dir => { for(let k = 0; k < eq.length; k++) tryPlace(eq, dir === 'across' ? mid - k : mid - k * N, dir); }); continue; }
    for(let k = 0; k < eq.length; k++){
      const spots = at[eq[k]]; if(!spots) continue;
      spots.forEach(i => { tryPlace(eq, i - k, 'across'); tryPlace(eq, i - k * N, 'down'); });
    }
  }
  moves.sort((a, b) => a.score - b.score || a.pend.length - b.pend.length);
  return moves;
}
// strength 0..1 → which move from the sorted list (1 = the best one).
function chooseMove(moves, strength){
  if(!moves.length) return null;
  if(strength >= 1) return moves[moves.length - 1];
  const hi = Math.min(moves.length - 1, Math.round(strength * (moves.length - 1))), lo = Math.max(0, hi - Math.max(1, Math.round(moves.length * 0.15)));
  return moves[lo + rnd(hi - lo + 1)];
}
