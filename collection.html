<style>
  :root{

    --terracotta:#C97B5D; --sage:#8FA37E; --dusty-blue:#6E93A8; --mustard:#D9A94D;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{height:100%;background:var(--bg);}
  body{
    margin:0;background-color:var(--bg);background-image:var(--bg-art);background-size:var(--bg-size,auto);background-attachment:fixed;font-family:var(--font-body,'Nunito',sans-serif);color:var(--ink);

  p.sub{color:var(--ink-soft);font-weight:700;text-align:center;margin:0 0 16px;}
  .who-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px;}
  .chip{min-height:34px;border:2px solid transparent;cursor:pointer;background:var(--card);color:var(--ink);font-weight:800;font-size:0.82rem;padding:6px 12px;border-radius:12px;box-shadow:0 2px 0 rgba(0,0,0,0.06);font-family:inherit;}

  .card .count{font-family:var(--font-display,'Fredoka',sans-serif);font-weight:700;color:var(--terracotta);}
  .tag{font-size:0.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);}

  .pics{display:flex;align-items:flex-end;gap:6px;background:var(--panel);border-radius:14px;padding:6px;}

  .bar{height:8px;border-radius:5px;background:var(--panel);overflow:hidden;} .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--terracotta),var(--mustard));}

  .beasts{background:linear-gradient(160deg,#2B1E5A,#4A2C7A 60%,#1E3A6A);color:#FFF6DC;border-radius:20px;padding:12px 14px;margin-bottom:14px;box-shadow:0 4px 0 rgba(0,0,0,0.12),inset 0 0 0 3px #FFD84D;}

  .bs-note{font-size:0.78rem;font-weight:700;color:#FFE9A8;margin-bottom:8px;}
  .bs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
  .bs-card{background:rgba(255,255,255,0.08);border:2px solid #FFD84D;border-radius:16px;padding:6px 8px 8px;display:grid;grid-template-columns:86px 1fr;gap:4px 8px;align-items:start;position:relative;}
  .bs-card.own{background:rgba(255,216,77,0.16);box-shadow:0 0 14px rgba(255,216,77,0.45);}
  .bs-card canvas{width:86px;aspect-ratio:120/132;display:block;grid-row:span 2;} .bs-card.lock canvas{filter:grayscale(0.8) brightness(1.1);opacity:.6;}
  .bs-card b{font-size:0.92rem;display:block;} .bs-card .lg{font-size:0.62rem;font-weight:900;letter-spacing:.06em;color:#FFD84D;text-transform:uppercase;}

  .bs-card .bs-need{grid-column:2;font-size:0.7rem;font-weight:800;line-height:1.35;color:#FFE9A8;} .bs-card .bs-need span{display:block;}
  .st-ride .lk{position:absolute;top:4px;right:6px;font-style:normal;}
  /* ⬛ Polyplot field journal (11l) */
  .pj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;} .pj-theme{background:var(--panel);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;} .pj-theme.done{box-shadow:0 0 0 2px #FFC845;} .pj-theme small{font-size:.72rem;font-weight:800;color:var(--ink-soft);} .pj-row{display:flex;gap:4px;font-size:1.4rem;} .pj-row .no{filter:grayscale(1);opacity:.3;}
  /* 📖 word journal (Lettercraft words met, plan 11p) */
  .journal{background:var(--card);border-radius:20px;padding:12px 14px;margin-bottom:14px;box-shadow:0 4px 0 rgba(0,0,0,0.08);}
  .journal h2{font-size:1.1rem;margin:0 0 6px;} .journal h2 small{font-size:.8rem;font-weight:700;color:var(--ink-soft);}
  .wd-shelf{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px;} .wd-shelf b{flex:0 0 100%;font-size:.86rem;} .wd-shelf span{background:var(--panel);color:var(--ink);border-radius:10px;padding:3px 8px;font-weight:800;font-size:.74rem;} .wd-shelf span.full{background:linear-gradient(135deg,#FFC845,#FF8A3D);color:#3A2500;}
  /* 📖 WisStock cards (same look as WisDeck mini cards) */
  #wdstock .ws-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin-top:10px;}
  #wdstock .wcard{--c:#3D6BFF;position:relative;width:100%;aspect-ratio:5/7;border-radius:8px;background:#FFFDF6;color:#1B2140;overflow:hidden;box-shadow:0 0 0 2px #FFC845,0 3px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;container-type:inline-size;}
  #wdstock .wcard .hd{background:var(--c);min-height:12cqw;} #wdstock .wcard .pw{position:absolute;left:3cqw;top:3cqw;width:20cqw;height:20cqw;border-radius:50%;background:#FFC845;color:#3A2500;font-weight:900;font-size:12cqw;display:flex;align-items:center;justify-content:center;z-index:2;}
  #wdstock .wcard .art{height:58cqw;margin:4cqw 5cqw 0;border-radius:4cqw;background:radial-gradient(circle,#fff,#E6ECFA);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #wdstock .wcard .art .wc-emo,#wdstock .wcard .art .wc-flag{font-size:38cqw;line-height:1;} #wdstock .wcard .art .wc-flag{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;}
  #wdstock .wcard .art .wc-img{width:100%;height:100%;object-fit:contain;} #wdstock .wcard .art .wc-img.wc-map{object-fit:cover;} #wdstock .wcard .art .wc-formula{font-weight:900;font-size:16cqw;color:#2A1E6B;}
  #wdstock .wcard .art .wc-cap{display:flex;align-items:flex-end;} #wdstock .wcard .art .wc-cap .wc-flag{font-size:28cqw;} #wdstock .wcard .art .wc-city{font-size:16cqw;}
  #wdstock .wcard .nm{font-weight:900;font-size:10cqw;text-align:center;padding:3cqw 3cqw 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} #wdstock .wcard .cnt{position:absolute;right:3cqw;top:3cqw;background:#13203F;color:#FFC845;border-radius:5cqw;padding:0 3cqw;font-weight:900;font-size:9cqw;z-index:3;}
  #wdstock .wcard.ghost{background:repeating-linear-gradient(45deg,#E6EAF2 0 8%,#EEF1F7 8% 16%);box-shadow:0 0 0 2px #C3CADA;align-items:center;justify-content:center;} #wdstock .wcard.ghost b{font-size:30cqw;color:#B7BFD0;}

  #wdstock .wcard[data-tier="4"]{box-shadow:0 0 0 3px #E2F6FF,0 0 0 5px #6FC8FF,0 0 12px 3px rgba(111,200,255,.7);} #wdstock .wcard[data-tier="5"]{box-shadow:0 0 0 3px #B57BFF,0 0 14px 4px #7B2CFF;}
  #wdstock .ws-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;} #wdstock .ws-chips button{border:none;border-radius:10px;padding:5px 10px;min-height:36px;font-weight:800;cursor:pointer;background:var(--panel);color:var(--ink);} #wdstock .ws-chips button.on{background:linear-gradient(135deg,#3D6BFF,#7B4DFF);color:#fff;}

  .wj-word{display:grid;grid-template-columns:34px 1fr;gap:2px 6px;align-items:start;background:var(--panel);border-radius:12px;padding:6px 8px;}
  .wj-word .e{font-size:1.4rem;grid-row:span 2;} .wj-word b{font-family:'Fredoka',sans-serif;letter-spacing:.04em;} .wj-word b i{font-style:normal;font-size:.72rem;color:var(--ink-soft);font-family:inherit;}

  .mcard{align-items:center;text-align:center;cursor:default;} .mcard canvas{width:150px;height:150px;} .mcard .by{font-size:0.8rem;font-weight:800;color:var(--ink-soft);}
  .made-empty{grid-column:1/-1;text-align:center;font-weight:800;color:var(--ink-soft);padding:10px;}
  /* ---------- MOBILE BACK BUTTON (desktop has the nav bar instead) ---------- */
  .mobile-back{
    position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));

const WD_CATS = [["wisflag", "🚩", "WisFlag", "world"], ["wisshape", "🧩", "WisTerri", "world"], ["wismap", "🗺️", "WisMap", "world"], ["wiscapital", "🏙️", "WisCapital", "world"], ["wislandmark", "🗼", "WisLandmark", "world"], ["wisyum", "🍜", "WisYum", "world"], ["wissport", "⚽", "WisSport", "world"], ["wisjob", "👩‍🚒", "WisJob", "world"], ["wistune", "🎺", "WisTune", "world"], ["wisdino", "🦖", "WisDino", "time"], ["wishuman", "🦴", "WisHuman", "time"], ["wisancient", "🏛️", "WisAncient", "time"], ["wistime", "🕰️", "WisTime", "time"], ["wisgreek", "🦉", "WisGreek", "time"], ["wismyth", "🐉", "WisMyth", "time"], ["wisgenius", "🧑‍🔬", "WisGenius", "time"], ["wisexplore", "🧭", "WisExplore", "time"], ["wissiam", "🏯", "WisSiam", "time"], ["wistaiwan", "🏝️", "WisTaiwan", "time"], ["wisviking", "🛶", "WisViking", "time"], ["wismammal", "🐘", "WisMammal", "zoo"], ["wisbird", "🦜", "WisBird", "zoo"], ["wisreptile", "🐊", "WisReptile", "zoo"], ["wisfarm", "🐄", "WisFarm", "zoo"], ["wisrare", "🐼", "WisRare", "zoo"], ["wisbug", "🐞", "WisBug", "zoo"], ["wisocean", "🐳", "WisOcean", "zoo"], ["wiscosmos", "🪐", "WisCosmos", "science"], ["wisplant", "🌻", "WisPlant", "science"], ["wisbody", "🫀", "WisBody", "science"], ["wischem", "🧪", "WisChem", "science"], ["wisbio", "🦠", "WisBio", "science"], ["wisphys", "🧲", "WisPhys", "science"], ["wisstone", "🪨", "WisStone", "science"], ["wischaos", "🌪️", "WisChaos", "science"], ["wisgeo", "📐", "WisShape", "science"], ["wiscraft", "🏺", "WisCraft", "made"], ["wistech", "💡", "WisTech", "made"], ["wishicle", "🚂", "WisHicle", "made"], ["wisunit", "📏", "WisUnit", "made"], ["wislaw", "⚖️", "WisLaw", "made"], ["wisculture", "🎎", "WisCulture", "made"], ["wisteaching", "🕊️", "WisTeaching", "made"], ["wiscloth", "👘", "WisCloth", "made"], ["wishair", "💇", "WisHair", "made"], ["wisraw", "🧱", "WisRaw", "made"]];
const WD_SHELVES = {world: '🌍 World', time: '⏳ Time', zoo: '🦁 Zoo', science: '🔬 Science', made: '🛠️ Human-made'}, WD_TIERS = [[0, '🥉'], [1, '🥈'], [3, '🥇'], [6, '💠'], [10, '💎'], [15, '🌌']];
// 📖 WisStock: every card of a category — yours with its tier frame, missing ones grey "?" (card data loaded only when opened)
let WS = {cat: 'wisflag', loading: false};
function openWisStock(){
  const box = $('wdstock'); if(!box) return; if(window.WisCards && WisCards.CATS){ renderWisStock(); return; } if(WS.loading) return; WS.loading = true;
  box.innerHTML = '<div class="ws-chips"><span>📖 Opening WisStock…</span></div>'; const close = UI.section(box, 'wisdeck');
  google.script.run.withSuccessHandler(d => { close(); WS.loading = false; try{ new Function(d.a)(); new Function(d.b)(); if(d.c) new Function(d.c)(); if(d.rows && WisCards.applyRows) WisCards.applyRows(d.rows); }catch(e){ box.innerHTML = '⚠️ Could not open WisStock'; return; } renderWisStock(); })
    .withFailureHandler(() => { close(); WS.loading = false; box.innerHTML = '⚠️ Could not open WisStock — try again'; }).getWisCardsData();
}
function renderWisStock(){
  const box = $('wdstock'), W = window.WisCards; if(!box || !W) return; let d = {}; try{ d = JSON.parse((D.settings || {})['Deck_' + who] || '{}') || {}; }catch(e){ d = {}; } const cards = d.cards || {};
  const list = W.cards(WS.cat), have = list.filter(c => cards[c.id] && cards[c.id].n > 0).length, tier = n => W.tierOf(Math.max(0, n - 1));
  box.innerHTML = '<div class="ws-chips">' + W.CATS.map(c => '<button class="' + (c.k === WS.cat ? 'on' : '') + '" data-k="' + c.k + '" data-sound="tap">' + c.icon + ' ' + c.en + '</button>').join('') + '</div>' +
    '<div class="ws-chips"><span>' + W.CAT[WS.cat].icon + ' ' + W.CAT[WS.cat].en + ' · ' + have + ' / ' + list.length + (have === list.length ? ' 🎓' : '') + '</span></div><div class="ws-grid">' +
    list.map(c => { const o = cards[c.id]; return o && o.n > 0 ? '<div class="wcard" style="--c:' + c.color + '" data-tier="' + tier(o.n) + '" title="' + UI.esc(c.en + ' · ' + c.th + ' · ⚡ ' + c.power + ' · ' + W.TIERS[tier(o.n)].en) + '"><div class="pw">' + c.power + '</div>' + (o.n > 1 ? '<span class="cnt">×' + o.n + '</span>' : '') + '<div class="hd"></div><div class="art">' + W.picHtml(c) + '</div><div class="nm">' + UI.esc(c.en) + '</div></div>'
      : '<div class="wcard ghost" title="Win it in the WisDeck quiz"><b>?</b></div>'; }).join('') + '</div>';
  box.querySelectorAll('.ws-chips button').forEach(b => b.onclick = () => { WS.cat = b.dataset.k; renderWisStock(); });
}
function renderWisBook(){
  const box = $('wdbook'); if(!box) return; let d = {}; try{ d = JSON.parse((D.settings || {})['Deck_' + who] || '{}') || {}; }catch(e){ d = {}; }
  const cards = d.cards || {}, ids = Object.keys(cards).filter(id => cards[id] && cards[id].n > 0); if(!ids.length){ box.classList.add('hidden'); return; }
  box.classList.remove('hidden'); const per = {}, tiers = [0, 0, 0, 0, 0, 0]; ids.forEach(id => { const k = id.split(':')[0]; per[k] = (per[k] || 0) + 1; const dup = cards[id].n - 1; let t = 0; WD_TIERS.forEach((x, i) => { if(dup >= x[0]) t = i; }); tiers[t]++; });
  const tot = d.tot || {}, full = d.full || [];
  box.innerHTML = '<h2>🃏 ' + UI.esc(who) + '\'s 📖 WisStock <small>' + ids.length + ' cards · 🎓 ' + full.length + ' full categories · ' + WD_TIERS.map((x, i) => x[1] + ' ' + tiers[i]).join(' ') + '</small></h2>' +
    Object.keys(WD_SHELVES).map(sh => '<div class="wd-shelf"><b>' + WD_SHELVES[sh] + '</b>' + WD_CATS.filter(c => c[3] === sh).map(c => { const n = per[c[0]] || 0, t = tot[c[0]] || 40; return '<span class="' + (full.indexOf(c[0]) >= 0 ? 'full' : '') + '">' + c[1] + ' ' + c[2] + ' ' + n + '/' + t + (full.indexOf(c[0]) >= 0 ? ' 🎓' : '') + '</span>'; }).join('') + '</div>').join('') +
    '<button class="wd-go" data-sound="pop" onclick="UI.go(WEBAPP_URL + \'?page=wisdeck&game=book&player=\' + encodeURIComponent(who), \'wisdeck\')">🃏 Open in WisDeck</button> <button class="wd-go" data-sound="pop" onclick="openWisStock()">📖 Show all cards here</button><div id="wdstock"></div>';
}
// 📖 Word journal (plan 11p): Lettercraft words this player met (Settings Words_<Name> = [[word, times, firstDate, meaning, emoji], …])
function renderJournal(){
  const box = $('journal'); let list = []; try{ list = JSON.parse((D.settings || {})['Words_' + who] || '[]') || []; }catch(e){ list = []; }
  if(!list.length){ box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  box.innerHTML = '<h2>📖 ' + UI.esc(who) + '\'s word journal <small>' + list.length + ' words met in 🔤 Lettercraft</small></h2><div class="wj-list">' +
    list.slice(0, 300).map(r => '<div class="wj-word"><span class="e">' + UI.esc(r[4] || '📖') + '</span><b>' + UI.esc(r[0]) + (r[1] > 1 ? ' <i>×' + r[1] + '</i>' : '') + '</b><small>' + UI.esc(r[3] || '—') + '</small></div>').join('') + '</div>';
}
// 🌟 Mystical Beasts shelf (plan 11q): gold frame, a kid-friendly story for each, and both locks (miles + beast quest).
function renderBeasts(l, have, miles, quests){
  const list = l.rides.map((r, i) => Object.assign({i}, r)).filter(r => r.beast), box = $('beasts');
  if(!list.length){ box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  box.innerHTML = '<h2>🌟 Mystical Beasts <small>' + list.filter(r => have.includes(r.i)).length + ' of ' + list.length + ' · legendary ride-ons</small></h2>' +
    '<div class="bs-note">Each beast needs BOTH: 🐾 its Adventure miles AND its 🎯 beast quest. Ride one in the Family Room and press 🐉 for 10 beast moves!</div>' +
    '<div class="bs-grid">' + list.map(r => { const own = have.includes(r.i), mOk = miles >= r.miles, qOk = quests.includes(r.i);
      return '<div class="bs-card ' + (own ? 'own' : 'lock') + '" data-beast="' + r.i + '"><canvas width="120" height="132" data-rv="' + r.i + '"></canvas>' +
        '<div><span class="lg">' + (own ? '✅ yours · legendary' : '🔒 legendary') + '</span><b>' + r.icon + ' ' + UI.esc(r.name) + '</b></div>' +
        '<div class="bs-need"><span>' + (mOk ? '✅' : '🐾') + ' ' + r.miles + ' miles' + (mOk ? '' : ' (' + Math.max(0, r.miles - miles) + ' to go)') + '</span><span>' + (qOk ? '✅' : '🎯') + ' ' + UI.esc(r.quest) + '</span></div>' +
        '<p>' + UI.esc(r.about) + '</p></div>'; }).join('') + '</div>';
  box.querySelectorAll('canvas[data-rv]').forEach(c => paint(c, l, Number(c.dataset.rv), who));
}
function load(){
  const close = UI.section($('grid'), 'collection');
  $('grid').style.minHeight = '200px';
  google.script.run.withSuccessHandler(d => {
    close(); $('grid').style.minHeight = ''; D = d;
    const k = UI.applyTheme(UI.themeFor(d.settings || {}, CURRENT_PLAYER)); UI.rememberTheme(CURRENT_PLAYER, k); UISound.applySettings(d.settings || {});
    if(!D.players.some(p => p.Name === who)) who = D.players.length ? D.players[0].Name : '';
    render();
  }).withFailureHandler(() => { close(); UI.toast('Could not open the collection — try again', 'err'); }).getItemsData(CURRENT_PLAYER);
}
load();
</script>
