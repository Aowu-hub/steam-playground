<script>
const CURRENT_PLAYER = ''+__SP("player")+''; window.SP_PAGE = 'isotest';
UI.navBar(document.getElementById('back-btn'), {});
// 🎛️ a dock label = an icon + its words (textContent stays "🎯 Zoe" for the tests); every press pops
function setLbl(el, txt){ const m = String(txt).match(/^(\S+)\s([\s\S]*)$/), esc = t => t.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'})[c]);
  if(!m){ el.textContent = txt; return; } el.innerHTML = '<span class="bi">' + esc(m[1]) + '</span> <span class="bl">' + esc(m[2]) + '</span>'; el.setAttribute('aria-label', m[2]); }
document.querySelectorAll('#tools .sp-btn').forEach(b => { setLbl(b, b.textContent.trim()); b.addEventListener('click', () => { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }); });
document.getElementById('hud').addEventListener('click', e => e.currentTarget.classList.toggle('open'));
// the minimap + tip sit just above the dock (its real height); the 💬 Tell us button rises above the dock when they would overlap
function placeDock(){ const d = document.getElementById('tools').getBoundingClientRect(); document.documentElement.style.setProperty('--dock-h', Math.round(d.height) + 'px');
  const fb = document.getElementById('ui-fb-btn'); if(fb){ fb.style.bottom = ''; const f = fb.getBoundingClientRect(); if(f.width && f.right > d.left - 6 && f.left < d.right + 6) fb.style.bottom = Math.round(innerHeight - d.top + 8) + 'px'; }
  if(window.ISOTEST && ISOTEST.V){ const h = document.getElementById('hud').getBoundingClientRect(), p = {t: Math.round(h.bottom) + 4, b: Math.round(innerHeight - d.top) + 6}, q = ISOTEST.V.pad; if(Math.abs(p.t - (q.t || 0)) > 2 || Math.abs(p.b - (q.b || 0)) > 2) ISOTEST.V.setPad(p); } }   // only a REAL change moves the view
addEventListener('resize', () => requestAnimationFrame(placeDock)); setInterval(placeDock, 800); document.getElementById('tools').addEventListener('click', () => requestAnimationFrame(placeDock));
(function(){
'use strict';
const $ = id => document.getElementById(id);
const NAMES = ['Mia', 'Leo', 'Aowu', 'Sasha', 'Kai', 'Nina', 'Tom', 'Ploy', 'Bam', 'Fah', 'Joe', 'Mint', 'Ben', 'Ivy', 'Max', 'Zoe', 'Pim', 'Ray', 'Ann', 'Sam'];
const COUNTS = [10, 40, 100, 200], THEMES = [['meadow', 'Meadow'], ['storybook', 'Storybook'], ['beach', 'Beach'], ['snow', 'Snow'], ['lava', 'Lava']];
const S = {count: Iso.phone ? 40 : 40, theme: 0, edit: false, big: false, follow: false, units: [], items: [], M: null, V: null, mm: null, ms: [], fpsT: [], ready: false, rng: 1};
const rnd = () => (S.rng = (S.rng * 16807) % 2147483647) / 2147483647;

/* ---------- 🗺️ a little world: river + bridges, terraced hills, paths, flowers, a beach ---------- */
function makeWorld(n){
  const W = n, H = n, cx = W * 0.62, cy = H * 0.3, river = j => Math.round(W * 0.42 + Math.sin(j / H * 5.2) * W * 0.08);
  return Iso.map({w: W, h: H, theme: THEMES[S.theme][0], seed: 7, cell: (i, j) => {
    const rv = river(j), dr = i - rv;
    if(dr >= 0 && dr < Math.max(2, Math.round(W / 16))){ return (j % Math.round(H / 3)) === Math.round(H / 6) ? {t: 'wood', h: 0} : {t: 'water', h: 0}; }
    const hill = Math.max(0, 3.4 - Math.hypot(i - cx, (j - cy) * 1.2) / (W / 12)), h2 = Math.max(0, 2.2 - Math.hypot(i - W * 0.2, j - H * 0.72) / (W / 14));
    const h = Math.min(3, Math.floor(Math.max(hill, h2)));
    if(i + j > W * 1.65) return {t: 'sand', h: 0};
    if(Math.abs(j - Math.round(H * 0.55)) < 1 || (Math.abs(i - Math.round(W * 0.18)) < 1 && j < H * 0.55)) return {t: h ? 'grass' : 'path', h, cost: 0.6};
    if(h >= 3) return {t: 'stone', h};
    const r = Math.sin(i * 12.9898 + j * 78.233) * 43758.5453 % 1;
    return {t: Math.abs(r) < 0.12 ? 'flower' : 'grass', h};
  }});
}
function walkable(M){ const out = []; for(let j = 0; j < M.h; j++) for(let i = 0; i < M.w; i++) if(M.walk(i, j)) out.push([i, j]); return out; }

/* ---------- 🧍 walkers ---------- */
function makeUnit(k){
  const name = NAMES[k % NAMES.length] + (k >= NAMES.length ? ' ' + (1 + Math.floor(k / NAMES.length)) : ''), av = typeof defaultAvatar === 'function' ? defaultAvatar(name) : {};
  const who = {name, av}, spot = S.free[Math.floor(rnd() * S.free.length)];
  return {who, x: spot[0] + 0.5, y: spot[1] + 0.5, z: S.M.heightAt(spot[0], spot[1]), path: null, pi: 0, spd: 1.3 + rnd() * 0.8, dist: rnd() * 8, flip: false, wait: rnd() * 2, asking: false, pic: null,
    frames: null, px: 0, py: 0, pz: 0};
}
function framesOf(u){ const F = []; for(let f = 0; f < Iso.WALK_N; f++) F.push(Iso.avatar(u.who, {pose: 'walk', f})); return F; }
function goTo(u, tx, ty){ if(u.asking) return; u.asking = true;
  Iso.pathAsync(S.M, u, {x: tx, y: ty}).then(p => { u.asking = false; if(p && p.length > 1){ u.path = p; u.pi = 1; } else u.wait = 0.5 + rnd(); }); }
function wander(u){ const s = S.free[Math.floor(rnd() * S.free.length)]; goTo(u, s[0] + 0.5, s[1] + 0.5); }
function step(dt){
  for(const u of S.units){ u.px = u.x; u.py = u.y; u.pz = u.z;
    if(u.hold){ continue; }   // 🎬 in the action show: stands still
    if(!u.path){ u.wait -= dt; if(u.wait <= 0 && !u.asking) wander(u); continue; }
    const tgt = u.path[u.pi], dx = tgt.x - u.x, dy = tgt.y - u.y, d = Math.hypot(dx, dy), mv = u.spd * dt;
    if(d <= mv){ u.x = tgt.x; u.y = tgt.y; if(++u.pi >= u.path.length){ u.path = null; u.wait = 0.4 + rnd() * 2.5; } }
    else { u.x += dx / d * mv; u.y += dy / d * mv; }
    u.dist += mv; const sdx = dx - dy; if(Math.abs(sdx) > 0.05) u.flip = sdx < 0;
    const hz = S.M.heightAt(u.x, u.y); u.z += (hz - u.z) * Math.min(1, dt * 10);   // smooth step up / down a terrace
  }
}
function render(alpha, t){
  if(S.followU && S.V.followObj !== S.followU.it) stopFollow();   // a drag / minimap tap stops following
  for(let q = 0; q < S.units.length; q++){ const u = S.units[q], it = u.it;
    it.x = u.px + (u.x - u.px) * alpha; it.y = u.py + (u.y - u.py) * alpha; it.z = u.pz + (u.z - u.pz) * alpha;
    it.pic = u.frames[u.path && !u.hold ? Math.floor(u.dist * 3.2) % Iso.WALK_N : 0]; if(!it.act) it.flip = u.flip; }
  showTick(t);
  const st = Iso.frame(S.V, {items: S.items, t, groundFx: ringFx, overlay: (g, V) => { if(S.room && S.edit && ghost) Iso.footprint(g, V, ghost, t); showFx(g, V, t); }});
  S.mm.draw(); meter(st);
}
// ◇ pulsing ring under the followed friend + where friends were called to
function ringFx(g, V, t){
  const ring = (x, y, z, c, a) => { const p = V.toScreen(x, y, z), k = V.zoom, pul = 1 + Math.sin(t * 6) * 0.08; g.save(); g.translate(p.x, p.y); g.scale(pul, pul);
    g.strokeStyle = c; g.globalAlpha = a; g.lineWidth = 3; g.beginPath(); g.moveTo(0, -14 * k); g.lineTo(28 * k, 0); g.lineTo(0, 14 * k); g.lineTo(-28 * k, 0); g.closePath(); g.stroke(); g.restore(); };
  if(S.followU){ const it = S.followU.it; ring(it.x, it.y, it.z, '#FFC845', 0.95); const p = V.toScreen(it.x, it.y, it.z); g.font = "700 13px 'Fredoka', sans-serif"; g.textAlign = 'center'; const nm = '🎯 ' + S.followU.who.name, w = g.measureText(nm).width + 14;
    g.fillStyle = 'rgba(255,200,69,.95)'; g.beginPath(); g.roundRect ? g.roundRect(p.x - w / 2, p.y + 10, w, 20, 10) : g.rect(p.x - w / 2, p.y + 10, w, 20); g.fill(); g.fillStyle = '#2A2440'; g.fillText(nm, p.x, p.y + 25); }
  if(S.call && t - S.call.t < 1.4) ring(S.call.x, S.call.y, S.call.z, '#FF5C9A', 1 - (t - S.call.t) / 1.4);
}

/* ---------- ⏱️ speed meter ---------- */
let lastShow = 0;
function meter(st){
  const tn = performance.now(); S.ms.push(st.ms); S.fpsT.push(tn); while(S.fpsT.length && tn - S.fpsT[0] > 1000) S.fpsT.shift(); if(S.ms.length > 60) S.ms.shift();
  if(tn - lastShow < 300) return; lastShow = tn; const avg = S.ms.reduce((a, b) => a + b, 0) / S.ms.length, fps = S.fpsT.length;
  $('m-ms').textContent = avg.toFixed(1); $('m-ms').className = avg < 8 ? 'good' : avg < 14 ? 'ok' : 'bad'; $('m-fps').textContent = fps; $('m-fps').className = fps >= 50 || (Iso.budget.fps === 30 && fps >= 28) ? 'good' : fps >= 28 ? 'ok' : 'bad';
  $('m-more').textContent = '👥 ' + S.units.length + ' · 🧱 ' + st.chunks + ' chunks · 🖼️ ' + st.pics + ' pics · 🎚️ level ' + st.level + (Iso.budget.fps === 30 ? ' · 30 fps' : '') + ' · zoom ' + S.V.zoom.toFixed(2) + ' · ✨ ' + S.V.dpr + '×' + (st.photo ? ' · 📸' : '');
}

/* ---------- 🏡 room mode (ir-1): walls, windows, wall items, floor styles, furniture footprints, place tool ---------- */
const ROOM_LOOKS = [
  {k: 'house', name: 'House', floor: 'plank', c: ['#E9C99A', '#DDB984'], slab: '#8A6440', soil: '#B58B5A', sky: ['#9FD6FF', '#E0F4FF'], wall: {left: '#F3E6D3', right: '#EADBC4', trim: '#B58B5A', pattern: 'stripes'},
    windows: [{side: 'R', u: 3.5, kind: 'sky', ch: '☁️'}, {side: 'R', u: 8.5, kind: 'sky', ch: '🌤️'}, {side: 'L', u: 5, kind: 'sky', ch: '🌤️'}],
    decor: [{side: 'L', u: 2, z: 130, ch: '🖼️', size: 40}, {side: 'L', u: 8.5, z: 120, ch: '🪞', size: 40}, {side: 'R', u: 6, z: 130, ch: '🕰️', size: 34}, {side: 'R', u: 10.6, z: 130, ch: '🖼️', size: 38}],
    rugs: [{x: 3, y: 4, w: 4, d: 3, c: '#D96C6C'}, {x: 7, y: 8, w: 3, d: 3, c: '#4CC9F0'}],
    things: [{x: 0, y: 4, w: 1, d: 3, h: 34, c: '#4361EE'}, {x: 0, y: 1, w: 1, d: 2, h: 110, c: '#A0703F'}, {x: 8, y: 1, w: 2, d: 2, h: 34, c: '#C68C55', top: '🍕'}, {x: 10, y: 9, w: 2, d: 2, h: 22, c: '#FFFFFF', top: '🛏️'}, {x: 11, y: 0, w: 1, d: 1, h: 0, ch: '🪴'}]},
  {k: 'jungle', name: 'Jungle', floor: 'lawn', c: ['#7CC36A', '#6DB55C'], slab: '#6B4A2C', soil: '#8A5E36', sky: ['#8FD3FF', '#C8F1FF'], wall: {left: '#2F7A4A', right: '#3C9159', trim: '#1F5A35', pattern: 'leaves'},

function tap(cell){

// 🎬 act-1 action show: the friend nearest the middle is the target, up to 8 friends around take turns with every move (Iso.act on 🧱 B1's beats);
//   on CONTACT the effect starts at the hand / foot (Iso.act's anchor) and flies to the target, which reacts (knocked back · love-struck · falls · dizzy)
const SHOW_ACTS = ['act.shoot', 'move.punch.straight', 'beat.throw', 'act.cast', 'move.kick.roundhouse', 'act.summon', 'act.shield', 'move.punch.uppercut', 'act.heal', 'act.whip', 'act.slash', 'move.kick.front', 'act.spray', 'move.punch.haymaker', 'beat.force'];
// the target's answer: punches / kicks → the 🎬 ActionFX reaction that fits (uppercut → knock-up …); the rest → a reaction that fits the skill
const REACT = {'act.shoot': 'act.love', 'beat.throw': 'move.react.flinch', 'act.cast': 'move.react.dizzy', 'act.whip': 'move.react.spinout', 'act.slash': 'act.fall', 'act.spray': 'move.react.frozen', 'beat.force': 'move.react.pushslide'};

function showOn(on){ const sh = S.show; if(sh){ sh.cast.forEach(u => { u.hold = false; u.wait = 0.3; }); } S.show = null; S.fx.length = 0; $('t-act').classList.toggle('on', !!on); if(!on) return;
  let tgt = null, bd = 1e9; S.units.forEach(u => { const p = S.V.toScreen(u.it.x, u.it.y, u.it.z), d = Math.hypot(p.x - S.V.cx, p.y - S.V.cy); if(d < bd){ bd = d; tgt = u; } }); if(!tgt) return;
