<style>
  :root{
    --bg:#FBF6EF; --panel:#FBE9DA; --ink:#37474F; --ink-soft:#5B6B70; --card:#FFFFFF;
    --terracotta:#C97B5D; --sage:#8FA37E; --dusty-blue:#6E93A8; --mustard:#D9A94D;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{height:100%;background:var(--bg);}
  body{
    margin:0;background-color:var(--bg);background-image:var(--bg-art);background-size:var(--bg-size,auto);background-attachment:fixed;font-family:var(--font-body,'Nunito',sans-serif);color:var(--ink);
    min-height:100%;min-height:100dvh;
    padding-top:env(safe-area-inset-top);padding-bottom:var(--safe-b, 18px);
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
  }
  .hidden{display:none !important;}

  .wrap{max-width:720px;margin:0 auto;padding:26px 18px 60px;}
  h1{font-family:var(--font-display,'Fredoka',sans-serif);font-weight:700;font-size:1.8rem;margin:4px 0 2px;text-align:center;}
  p.sub{color:var(--ink-soft);font-weight:700;text-align:center;margin:0 0 24px;}

  .empty{text-align:center;color:var(--ink-soft);font-weight:700;margin-top:30px;}

  .rank-row{
    background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:0 4px 0 rgba(0,0,0,0.06);
    display:flex;align-items:center;gap:12px;cursor:pointer;
  }
  .rank-row.top1{border:2px solid var(--mustard);}
  .rank-row.top2{border:2px solid #C9CED6;}
  .rank-row.top3{border:2px solid var(--terracotta);}
  .rank-num{font-family:var(--font-display,'Fredoka',sans-serif);font-weight:700;font-size:1.1rem;color:var(--ink-soft);width:28px;text-align:center;flex-shrink:0;}
  .rank-medal{font-size:1.3rem;width:28px;text-align:center;flex-shrink:0;}
  .rank-avatar{
    width:44px;height:44px;border-radius:50%;background:var(--panel);display:flex;align-items:center;
    justify-content:center;font-family:var(--font-display,'Fredoka',sans-serif);font-weight:700;font-size:1.1rem;color:color-mix(in srgb, var(--terracotta) 65%, var(--ink));
    flex-shrink:0;
  }
  .rank-info{flex:1;min-width:0;}
  .rank-info .pname{font-weight:700;font-size:0.98rem;}
  .rank-info .page{font-size:0.72rem;color:var(--ink-soft);font-weight:700;}
  .rank-tokens{font-family:var(--font-display,'Fredoka',sans-serif);font-weight:700;font-size:1.05rem;color:color-mix(in srgb, var(--mustard) 55%, var(--ink));flex-shrink:0;}   /* audit: plain mustard was 2.2:1 on cream */
  .rank-chevron{color:var(--ink-soft);font-size:0.9rem;flex-shrink:0;transition:transform .15s;}
  .rank-row.open .rank-chevron{transform:rotate(90deg);}

  .badge-detail{display:none;padding:0 16px 14px 68px;}
  .badge-detail.open{display:block;}
  .badge-game{font-size:0.72rem;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;margin:8px 0 4px;}
  .badge-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .badge-chip{
    background:var(--panel);color:var(--terracotta);font-weight:700;font-size:0.72rem;
    padding:5px 10px;border-radius:10px;
  }
  .sec-title{font-family:var(--font-display,'Fredoka',sans-serif);font-weight:700;font-size:1.25rem;margin:28px 2px 10px;display:flex;align-items:baseline;gap:8px;}
  .sec-title small{font-family:var(--font-body,'Nunito',sans-serif);font-size:0.8rem;color:var(--ink-soft);font-weight:700;}
  .rec-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .rec{background:var(--card);border-radius:16px;padding:10px 6px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,0.06);display:flex;flex-direction:column;gap:2px;}
  .rec .lv{font-size:0.7rem;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
  .rec .ic{font-size:1.3rem;}
  .rec .tm{font-family:var(--font-display,'Fredoka',sans-serif);font-weight:700;font-size:1.05rem;color:var(--terracotta);}
  .rec .who{font-size:0.78rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rec.none .tm{color:var(--ink-soft);opacity:.5;}
  .rec-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;}
  .rec-tab{border:none;cursor:pointer;background:var(--card);color:var(--ink);font-weight:800;font-size:0.85rem;padding:8px 14px;border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,0.07);font-family:inherit;}
  .rec-tab.on{background:var(--terracotta);color:#fff;}
  .rec .sc{font-family:var(--font-display,'Fredoka',sans-serif);font-weight:700;font-size:1.15rem;color:var(--terracotta);}
  .rec .sub2{font-size:0.72rem;font-weight:800;color:var(--ink-soft);}
  .best-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin-top:4px;}
  .best-grid .g{font-weight:800;font-size:0.8rem;white-space:nowrap;}
  .title-chip{display:inline-block;background:var(--panel);color:var(--ink);font-weight:800;font-size:0.72rem;padding:4px 10px;border-radius:10px;}
  .title-chip.on{background:linear-gradient(135deg,var(--terracotta),var(--mustard));color:var(--on-accent,#fff);}
  .node-card{position:fixed;z-index:500;overflow-y:auto;background:var(--card,#fff);color:var(--ink,#222);border-radius:16px;padding:10px 12px;box-shadow:0 12px 32px rgba(0,0,0,0.28);font-size:0.85rem;pointer-events:auto;animation:ncIn .14s ease-out;}
  .node-card.hidden{display:none;}
  @keyframes ncIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .node-card .nc-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:1rem;}
  .node-card .nc-big{font-size:1.3rem;} .node-card .nc-title{font-size:0.75rem;font-weight:800;background:var(--panel,#eee);border-radius:8px;padding:2px 7px;}
  .node-card .nc-game{font-weight:800;color:var(--ink-soft,#666);margin:3px 0 6px;font-size:0.8rem;}
  .node-card .nc-row{display:flex;gap:8px;align-items:baseline;padding:2px 0;} .node-card .nc-row span{width:22px;text-align:center;flex:none;} .node-card .nc-row b{font-weight:800;}
  .node-card .nc-note{margin-top:6px;background:linear-gradient(135deg,#7A1020,#2E0609);color:#FFECEC;border-radius:10px;padding:5px 8px;font-weight:800;font-size:0.78rem;}
  .node-card .nc-bar{height:8px;border-radius:5px;background:var(--panel,#eee);overflow:hidden;margin-top:6px;} .node-card .nc-bar i{display:block;height:100%;background:linear-gradient(90deg,#4CB963,#FFC845);}
  .node-card .nc-small{font-size:0.72rem;color:var(--ink-soft,#666);font-weight:800;margin-top:2px;}
  [data-n]{cursor:pointer;} [data-n]:focus-visible{outline:3px solid #FFC845;outline-offset:1px;}
  .nc-on{box-shadow:0 0 0 3px #FFC845 !important;}
  .feat-chip{background:var(--panel);color:var(--ink);font-weight:800;font-size:0.74rem;padding:5px 10px;border-radius:10px;}
  .feat-chip small{opacity:.7;font-weight:800;}
  .feat-chip.t1{box-shadow:inset 0 0 0 2px #CD7F32;} .feat-chip.t2{box-shadow:inset 0 0 0 2px #A8B2BD;} .feat-chip.t3{box-shadow:inset 0 0 0 2px #E0B100;background:#FFF6D6;color:#5A4300;}
  .time-chip{background:var(--panel);color:var(--dusty-blue);font-weight:800;font-size:0.72rem;padding:5px 10px;border-radius:10px;}
  .log{background:var(--card);border-radius:18px;box-shadow:0 4px 0 rgba(0,0,0,0.06);overflow:hidden;}
  .log-row{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:0.85rem;font-weight:700;}
  .log-row + .log-row{border-top:1px solid var(--panel);}
  .log-row .when{color:var(--ink-soft);font-size:0.72rem;width:78px;flex-shrink:0;}
  .log-row .what{flex:1;min-width:0;}
  .log-row .t{color:var(--terracotta);font-family:var(--font-display,'Fredoka',sans-serif);}
  @media (max-width:560px){ .rec-grid{grid-template-columns:repeat(3,1fr);} .best-grid{grid-template-columns:1fr;} }
  /* records: one row per game, top 3 per level */
  .who-key{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 2px 12px;}
  .who-key span{display:inline-flex;align-items:center;gap:5px;background:var(--card);border-radius:10px;padding:4px 10px;font-weight:800;font-size:0.78rem;box-shadow:0 2px 0 rgba(0,0,0,0.05);}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;}
  .grow{background:var(--card);border-radius:18px;padding:10px 12px 12px;margin-bottom:12px;box-shadow:0 4px 0 rgba(0,0,0,0.06);border-left:6px solid var(--gc);}
  .grow-head{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px;font-family:var(--font-display,'Fredoka',sans-serif);font-weight:700;font-size:1.05rem;}
  .grow-head small{font-family:var(--font-body,'Nunito',sans-serif);font-size:0.75rem;color:var(--ink-soft);font-weight:700;}
  .grow-empty{font-size:0.82rem;font-weight:700;color:var(--ink-soft);padding:2px 2px 0;}
  .lvls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;} .lvls.six{grid-template-columns:repeat(6,minmax(0,1fr));}
  .lvl{background:var(--panel);border-radius:14px;padding:8px 8px 6px;min-width:0;}
  .lvl .lh{display:flex;align-items:center;gap:5px;font-size:0.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);margin-bottom:5px;}
  .lvl .lh .ic{font-size:1rem;}
  .pl{border-radius:10px;padding:4px 7px;margin-bottom:4px;font-weight:800;font-size:0.78rem;background:rgba(255,255,255,0.6);min-width:0;}
  .pl .top,.pl .bot{display:flex;align-items:center;gap:5px;min-width:0;}
  .pl .bot{justify-content:space-between;padding-left:2px;}
  .pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pl .v{font-family:var(--font-display,'Fredoka',sans-serif);font-weight:700;white-space:nowrap;font-size:1.05em;}
  .pl .tm{font-size:0.7rem;opacity:.8;white-space:nowrap;}
  .pl.r1{background:linear-gradient(135deg,#FFE58A,#F5B700);color:#4A3200;font-size:0.86rem;box-shadow:0 2px 0 rgba(160,110,0,0.35);}
  .pl.r2{background:linear-gradient(135deg,#F1F4F7,#B9C3CD);color:#2E3A45;}
  .pl.r3{background:linear-gradient(135deg,#F6D2B0,#CD8A4E);color:#3E2410;}
  .pl.r4{background:rgba(255,255,255,0.55);color:var(--ink-soft);font-size:0.72rem;}
  .lvl .more{font-size:0.68rem;font-weight:800;color:var(--ink-soft);text-align:center;}
  .lvl .none{font-size:0.75rem;font-weight:800;color:var(--ink-soft);opacity:.6;text-align:center;padding:8px 0;}
  @media (max-width:760px){ .lvls{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:4px;} .lvl{flex:1 1 46%;min-width:0;}   /* 📏 p2: levels wrap, never scroll */ }
  @media (max-width:420px){ .lvl{flex-basis:72%;} }
  .log-row{border-left:5px solid var(--gc,transparent);}
  .log-row .rk{font-size:0.7rem;font-weight:800;border-radius:8px;padding:2px 7px;white-space:nowrap;}
  .rk.r1{background:#F5B700;color:#4A3200;} .rk.r2{background:#B9C3CD;color:#2E3A45;} .rk.r3{background:#CD8A4E;color:#fff;}
  @media (max-width:560px){ .log-row{flex-wrap:wrap;row-gap:2px;} .log-row .what{flex-basis:calc(100% - 90px);} }
  /* 🏆 compact Archive (plan 11t-2): one short row per game, tap → its levels open in place; one open at a time */
  .grow{padding:0;margin-bottom:8px;overflow:hidden;}
  .grow-head{margin:0;padding:10px 12px;cursor:pointer;flex-wrap:wrap;align-items:center;row-gap:4px;border-radius:18px;user-select:none;}
  .grow-head:hover{background:color-mix(in srgb, var(--gc) 8%, transparent);}
  .grow-head:focus-visible{outline:3px solid #FFC845;outline-offset:-3px;}
  .grow-head .gname{flex:1 1 150px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .grow-head .gsum{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--font-body,'Nunito',sans-serif);font-size:0.74rem;font-weight:800;}
  .gsum .gs{background:var(--panel);border-radius:9px;padding:3px 8px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;max-width:100%;}
  .gsum .gs.lead{background:linear-gradient(135deg,#FFE58A,#F5B700);color:#4A3200;}
  .gsum .gs.me{background:color-mix(in srgb, var(--gc) 16%, var(--card));}
  .gsum .gs.n{color:var(--ink-soft);}
  .gsum .gs .nm{overflow:hidden;text-overflow:ellipsis;max-width:9em;}
  .grow-head .gchev{color:var(--ink-soft);font-size:0.9rem;transition:transform .15s;flex:none;margin-left:2px;}
  .grow.open .gchev{transform:rotate(90deg);}
  .grow .gbody{display:none;padding:0 12px 12px;}
  .grow-sub{font-size:0.74rem;font-weight:700;color:var(--ink-soft);margin:0 2px 6px;}
  .grow.open .gbody{display:block;animation:ncIn .16s ease-out;}
  .grow.open{box-shadow:0 6px 16px rgba(0,0,0,0.10);}
  .unplayed-box{background:var(--card);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 rgba(0,0,0,0.06);margin-top:4px;}
  .unplayed-box .ut{font-weight:800;font-size:0.8rem;color:var(--ink-soft);margin-bottom:6px;}
  .unplayed-box .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .grow.unplayed{display:inline-flex;margin:0;border-left:none;box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--gc) 35%, transparent);background:var(--panel);border-radius:10px;padding:4px 9px;font-weight:800;font-size:0.76rem;overflow:visible;}
  .rec-tools{display:flex;justify-content:flex-end;margin:-4px 0 8px;}
  .rec-tools button{border:none;background:var(--card);color:var(--ink-soft);font-family:inherit;font-weight:800;font-size:0.76rem;padding:6px 12px;border-radius:12px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,0.06);min-height:32px;}
  @media (max-width:560px){
    .grow-head{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:6px;padding:8px 10px;}
    .grow-head .gname{grid-column:1;grid-row:1;font-size:0.98rem;}
    .grow-head .gchev{grid-column:2;grid-row:1;}
    .grow-head .gsum{grid-column:1 / -1;grid-row:2;flex-wrap:nowrap;overflow:hidden;font-size:0.7rem;gap:4px;}
    .gsum .gs{padding:2px 6px;} .gsum .gs.n{display:none;} .gsum .gs .nm{max-width:6em;}
    .grow .gbody{padding:0 8px 10px;}
  }
  .no-badges{display:none;font-size:0.8rem;color:var(--ink-soft);font-style:italic;padding:0 16px 14px 68px;}
  .no-badges.open{display:block;}

  /* ---------- MOBILE BACK BUTTON (desktop has the nav bar instead) ---------- */
  .mobile-back{
    position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));
    z-index:200;border:none;border-radius:14px;background:var(--card);box-shadow:0 3px 0 rgba(0,0,0,0.08);
    min-height:38px;   /* audit: was 31px, too small for little fingers */
    padding:8px 12px;font-family:var(--font-display,'Fredoka',sans-serif);font-weight:700;font-size:0.8rem;color:var(--dusty-blue);
    cursor:pointer;display:flex;align-items:center;gap:4px;
  }

  /* ---------- DESKTOP NAV (hidden on touch/tablet) ---------- */
  .desktop-nav{display:none;}
  @media (pointer:fine) and (hover:hover) and (min-width:820px){
    .desktop-nav{
      display:flex;position:fixed;top:0;left:0;right:0;height:52px;z-index:100;
      background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,0.08);
      align-items:center;justify-content:space-between;padding:0 24px;
    }
    .desktop-nav .brand{font-family:var(--font-display,'Fredoka',sans-serif);font-weight:700;color:var(--terracotta);}
    .desktop-nav .links{display:flex;gap:6px;}
    .desktop-nav .links button{
      border:none;background:none;font-family:var(--font-body,'Nunito',sans-serif);font-weight:700;font-size:0.85rem;
      color:var(--ink-soft);padding:8px 14px;border-radius:10px;cursor:pointer;
    }
    .desktop-nav .links button:hover{background:var(--panel);color:var(--ink);}
    .desktop-nav .links button.admin{color:var(--terracotta);}
    body{padding-top:52px;}
    .mobile-back{display:none;}
  }

  @media (max-width:900px){
    .wrap{padding-top:calc(56px + env(safe-area-inset-top));}
  }
</style>
<script src="inc/UiKit.js"></script>
<script src="inc/Themes.js"></script>

<!-- ontouchstart="" is a deliberate no-op: iOS Safari/WKWebView only honors
     :active styles on descendants when SOME ancestor has a touch listener
     registered. Without it, every :active press-down effect in this file
     (rank rows, the back button) silently never shows on iPhone/iPad, even
     though it works fine on desktop and Android Chrome. -->
<body ontouchstart="">
<!-- Mobile has no top nav bar (that's desktop-only), so without this a
     phone/tablet visitor here has no way back to the Dashboard at all. -->
<button class="mobile-back" data-sound="none" onclick="goNav('home')">🏠 Dashboard</button>

<nav class="desktop-nav">
  <div class="brand">STEAM Playground</div>
  <div class="links">
    <button onclick="goNav('home')">Dashboard</button>
    <button onclick="goNav('gameroom')">Gameroom</button>
    <button onclick="goNav('achievements')">Achievements</button>
    <button class="admin" onclick="goNav('setup')">Admin</button>
  </div>
</nav>

<div class="wrap">
  <h1 class="t-head">🏆 Achievement Archive</h1>
  <p class="sub">everyone's tokens and badges, ranked</p>

  <div id="rank-list"></div>
  <div class="empty hidden" id="empty-msg">No badges earned yet — play a game to be the first on the board!</div>

  <div id="maze-box" class="hidden">
    <h2 class="sec-title t-head">🏆 Family records <small>tap a game to see the top 3 per level · 🥇 🥈 🥉</small></h2>
    <div class="who-key" id="who-key"></div>
    <div class="rec-tools"><button id="rec-all" type="button" onclick="toggleAllGames()">Open all ▾</button></div>
    <div id="boards"></div>
  </div>
  <div id="recent-box" class="hidden">
    <h2 class="sec-title t-head">⏱ Recent finishes <small>the last 10</small></h2>
    <div class="log t-card" id="recent-log"></div>
  </div>
</div>

<script>
const WEBAPP_URL = ''+__SP("webAppUrl")+'';
const CURRENT_PLAYER = ''+__SP("player")+''; window.SP_PAGE = 'achievements';

/* ---------- LOOK: the player's own theme ---------- */
UI.applyTheme(UI.cachedTheme(CURRENT_PLAYER));
function applyLook(settings){ const k = UI.applyTheme(UI.themeFor(settings, CURRENT_PLAYER)); UI.rememberTheme(CURRENT_PLAYER, k); }

const NAV_KIND = {home:'home', gameroom:'rooms', achievements:'trophy', setup:'admin', room:'room', collection:'collection'};
function goNav(page){
  UI.go(WEBAPP_URL + '?page=' + page + (CURRENT_PLAYER ? '&player=' + encodeURIComponent(CURRENT_PLAYER) : ''), NAV_KIND[page] || 'nav');
}

// One call for the ranking + settings; the list area shows its own loader.
function loadAchievements(){
  const box = document.getElementById('rank-list');
  box.style.minHeight = '140px';

    '<div class="log-row"' + node({k: 'log', r}) + ' style="--gc:' + (GAME_COLOR[r.game] || 'transparent') + '"><span class="when">' + UI.esc(String(r.date).slice(5)) + '</span>' +
    '<span class="what">' + dot(r.name) + ' ' + UI.esc(r.name) + ' · ' + UI.esc(GAME_LABEL[r.game] || r.game) + ' ' + UI.esc(r.levelName || LEVEL_NAMES[r.level] || '') + '</span>' +
    (r.rank ? '<span class="rk r' + r.rank + '">' + ['🥇 1st', '🥈 2nd', '🥉 3rd'][r.rank - 1] + '</span>' : '') +
    (r.score ? '<span class="t">🏆 ' + Number(r.score).toLocaleString() + '</span>' : '') + (r.timeSec ? '<span class="t">⏱ ' + fmtSec(r.timeSec) + '</span>' : '') + '<span>' + stars(r.stars) + '</span></div>').join('');
  document.getElementById('recent-box').classList.remove('hidden');
}
/* ---------- feats badges + titles ---------- */
let TITLES = {players: {}, meta: []};
function chosenTitle(n){ const p = TITLES.players[n]; return p && p.chosen ? TITLES.meta.find(t => t.id === p.chosen) : null; }
const FEAT_GAME = {'pokadif-arcade': '⏱️ Pokadif Arcade', 'sciencetory': '🔬 Sciencetory', 'pokadif': '🔍 Pokadif', 'blasoff': '⚽ BlasOff', 'pyraspike': '🔥 PyraDive', 'td-draprincess': '🏰 TD-Stories', 'artifactory': '🏭 Artifactory', 'georead': '🔤 GeoRead', 'geoscout': '🔢 GeoScout', 'beat-piano': '🎹 BeatCorner Piano', 'beat-drums': '🥁 BeatCorner Drums', 'brawenture': '🗺️ Brawenture', 'wisdeck': '🃏 WisDeck', 'eyes-brain': '👀🧠 Eyes Brain Riot', 'polyplot': '⬛ Polyplot', 'soul-bopper': '👻💣 Soul Bopper', 'snakeast': '🍎 Snakize Snakeast', 'snakigate': '🧭 Snakize Snakigate', 'snakastle': '🏰 Snakize Snakastle', 'snaketale': '📜 Snakize Snaketale', 'alignext': '🔴 Alignext Drop', 'omnifile': '❌⭕ Alignext Omnifile', 'brawl-buddies': '🥊 Brawl Buddies', 'pose-party': '📷 Pose Party', 'sla-brall': '🏓 SlaBrall', 'beat-corner': '🎵 BeatCorner', 'sweet-swap': '🍬 Sweet Swap', 'word-board': '🔤 Lettercraft', 'number-board': '➗ Algebros', 'double-up': '🔀 Double Up', 'block-drop': '🧱 Block Drop', 'pop-blocks': '🫧 Pop Blocks', 'number-grid': '🔢 Digitinct', 'math-quest': '🧮 Math Quest', checkers: '🔴 Checkers', chess: '♞ Chess', pinball: '🎯 Pinball', hopper: '🐸 Dodgy Hopper', turbo: '🏎️ Turbo Trail', memory: '🃏 Memory Match', workshop: '🔨 Furniture Workshop'};
function featsWall(name){
  const p = TITLES.players[name]; if(!p) return '';
  const titles = p.unlocked.map(id => TITLES.meta.find(t => t.id === id)).filter(Boolean);
  let h = '';
  if(titles.length) h += '<div class="badge-game">🏷️ Titles earned</div><div class="badge-chips">' + titles.map(t => '<span class="title-chip' + (p.chosen === t.id ? ' on' : '') + '"' + node({k: 'title', t, name}) + '>' + t.icon + ' ' + UI.esc(t.name) + '</span>').join('') + '</div>';
  const byGame = {};
  (p.badges || []).forEach(b => { (byGame[b.game] = byGame[b.game] || []).push(b); });
  Object.keys(byGame).forEach(g => {
    h += '<div class="badge-game">' + (FEAT_GAME[g] || g) + ' feats</div><div class="badge-chips">' + byGame[g].map(b =>
      '<span class="feat-chip t' + b.tier + '"' + node({k: 'feat', b, name}) + '>' + b.medal + ' ' + b.icon + ' ' + UI.esc(b.name) +
      ' <small>' + (b.kind === 'min' ? b.value + ' ' + b.unit : b.kind === 'max' ? 'best ' + Number(b.value).toLocaleString() : '×' + b.value) + '</small></span>').join('') + '</div>';
  });
  return h;
}
function bestHtml(b){
  // one line per game: the hardest level cleared with its time and best score
  const rows = REC_TABS.map(T => {
    const list = (b || {})[T.id] || [];
    const chips = list.map((x, li) => x && (x.timeSec || x.score) ? '<span class="time-chip"' + node({k: 'best', label: T.label, lv: li, x}) + '>' + LEVEL_ICONS[li] + ' ' + LEVEL_NAMES[li] + (x.score ? ' · 🏆 ' + Number(x.score).toLocaleString() : '') + (x.timeSec ? ' · ⏱ ' + fmtSec(x.timeSec) : '') + ' ' + stars(x.stars) + '</span>' : '').join('');
    return chips ? '<span class="g">' + T.label + '</span><div class="badge-chips">' + chips + '</div>' : '';
  }).join('');
  return rows ? '<div class="badge-game">Best results</div><div class="best-grid">' + rows + '</div>' : '';
}
function renderList(leaderboard, bests){
  bests = bests || {}; BESTS = bests;
  const box = document.getElementById('rank-list');
  box.innerHTML = '';
  document.getElementById('empty-msg').classList.toggle('hidden', leaderboard.length > 0);

  leaderboard.forEach((entry, i)=>{
    const rank = i + 1;
    const medal = rank===1 ? '🥇' : rank===2 ? '🥈' : rank===3 ? '🥉' : '';
    const topCls = rank<=3 ? ' top'+rank : '';

    const row = document.createElement('div');
    row.className = 'rank-row t-card' + topCls;
    row.innerHTML =
      (medal ? '<div class="rank-medal">'+medal+'</div>' : '<div class="rank-num">'+rank+'</div>') +
      '<div class="rank-avatar">'+UI.esc(entry.name ? entry.name.charAt(0).toUpperCase() : '?')+'</div>' +
      '<div class="rank-info"><div class="pname">'+UI.esc(entry.name)+'</div><div class="page">'+(chosenTitle(entry.name) ? '<span class="title-chip on">' + chosenTitle(entry.name).icon + ' ' + UI.esc(chosenTitle(entry.name).name) + '</span> ' : '')+UI.esc(entry.age||'')+'</div></div>' +
      '<div class="rank-tokens">'+UI.esc(entry.tokenCount)+' 🏅</div>' +
      '<div class="rank-chevron">▸</div>';

    const detail = document.createElement('div');
    const best = bestHtml(bests[entry.name]) + featsWall(entry.name);
    if((entry.gamesPlayed && entry.gamesPlayed.length) || best){
      detail.className = 'badge-detail';
      detail.innerHTML = (entry.gamesPlayed || []).map(g =>
        '<div class="badge-game">'+UI.esc(g.gameName)+'</div><div class="badge-chips">' +
        g.tokens.map(t => '<span class="badge-chip">🏅 '+UI.esc(t)+'</span>').join('') +
        '</div>'
      ).join('') + best;
    } else {
      detail.className = 'no-badges';
      detail.textContent = 'No badges yet.';
    }

    row.onclick = ()=>{
      row.classList.toggle('open');
      detail.classList.toggle('open');
    };

    box.appendChild(row);
    box.appendChild(detail);
  });
}

loadAchievements();
