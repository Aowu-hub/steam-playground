     REAL engine (UiKit UISound.mood): drag 😌→😬 Tension, try 🤫 robot thinks · 💥 game sound (ducks the music) · 🎉 big win · ⏸ · ⏱️ run out the clock.

<style>
  :root{--bg:#F6F1E8;--card:#FFFFFF;--panel:#EFE7DA;--ink:#2B2440;--ink-soft:#6B6185;--terracotta:#E8724A;--mustard:#F2B640;--game-a:#7C5CFF;--game-b:#FF6B9D;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:linear-gradient(160deg,#F7F0FF,#FFF4EA 55%,#EAF7F4);color:var(--ink);font-family:'Nunito',sans-serif;}

  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:rgba(255,255,255,.82);backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(60,40,90,.08);}
  .top h1{flex:1;margin:0;text-align:center;font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.05rem,2.4vw + .4rem,1.5rem);}

  .tb{min-height:44px;min-width:44px;padding:0 12px;border:0;border-radius:14px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:1rem;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(43,36,64,.14),0 0 0 2px rgba(43,36,64,.08) inset;}
  #mus.gb-mus-off{opacity:.6;}
  main{flex:1 0 auto;width:100%;max-width:1100px;margin:0 auto;padding:10px 10px 0;}

  .fam.on{background:linear-gradient(135deg,var(--game-a),var(--game-b));color:#fff;}

  .card:active{transform:translateY(2px);}

  .card .tg{font-weight:700;font-size:.72rem;color:#7A6E95;line-height:1.25;}
  .card .fb{position:absolute;right:8px;top:8px;font-size:.72rem;font-weight:800;padding:2px 7px;border-radius:10px;background:var(--fc,#EEE);color:#2B2440;}
  .card.on{box-shadow:0 0 0 3px var(--game-a),0 6px 16px rgba(124,92,255,.3);animation:mlBeat 1.2s ease-in-out infinite;}
  @keyframes mlBeat{50%{transform:scale(1.025);}}
  .days{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 10px;}   /* 🎊 24y-c */
  .day{min-height:40px;padding:0 11px;border:0;border-radius:20px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.88rem;cursor:pointer;background:#FFF7E6;color:var(--ink);box-shadow:0 2px 0 rgba(43,36,64,.12);}
  .day.on{background:linear-gradient(135deg,#F2B640,#E8724A);color:#fff;}
  .pkrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:0 0 10px;font-weight:800;font-size:.82rem;color:var(--ink-soft);}   /* 🎵 24y-d */
  .pkrow button{min-height:40px;padding:0 12px;border:0;border-radius:20px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.88rem;cursor:pointer;background:#EFE9FF;color:var(--ink);box-shadow:0 2px 0 rgba(43,36,64,.12);}
  .pkrow button.on{background:linear-gradient(135deg,var(--game-a),var(--game-b));color:#fff;}
  .card .pk{font-weight:800;font-size:.72rem;color:#5B3FD6;background:#EFE9FF;border-radius:8px;padding:1px 6px;}
  .own{margin:0 0 12px;text-align:center;font-weight:700;font-size:.82rem;color:var(--ink-soft);}
  .panel{position:sticky;bottom:0;z-index:6;width:100%;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);box-shadow:0 -4px 18px rgba(60,40,90,.14);padding:8px 10px var(--safe-b,18px);}
  .pin{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:6px;}
  .now{display:flex;align-items:center;gap:8px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:1rem;min-height:26px;}
  .now .ly{margin-left:auto;font-family:'Nunito',sans-serif;font-size:.76rem;font-weight:800;color:var(--ink-soft);text-align:right;}
  .ten{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.85rem;}
  .ten input{flex:1;min-width:0;height:40px;accent-color:#E8724A;}
  .acts{display:flex;flex-wrap:wrap;gap:6px;}
  .acts button{flex:1 1 auto;min-height:44px;padding:0 10px;border:0;border-radius:14px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.9rem;cursor:pointer;background:#F1ECFA;color:var(--ink);}
  .acts button.lit{background:linear-gradient(135deg,var(--game-a),var(--game-b));color:#fff;}
  .acts button:disabled{opacity:.45;cursor:default;}
  .panel.idle .ten,.panel.idle .acts{opacity:.5;pointer-events:none;}
  @media (max-height:520px) and (orientation:landscape){
    .top{padding-top:6px;padding-bottom:6px;} .top h1 small{display:none;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));} .card .tg{display:none;}
    .pin{flex-direction:row;flex-wrap:wrap;align-items:center;} .now{flex:1 1 100%;min-height:20px;} .ten{flex:1 1 220px;} .acts{flex:2 1 300px;}
    .acts button{min-height:40px;font-size:.82rem;}
  }
</style>

<body>
<script src="inc/UiKit.js"></script>
<script src="inc/UiKitNet.js"></script>

<div class="top">
  <button class="tb" id="back" type="button" data-sound="none"></button>
  <h1>🎵 Mood Lab<small>Every game's background music · tap a card to listen</small></h1>
  <button class="tb gb-mus" id="mus" type="button" title="Music" aria-label="Music" data-sound="tap">🎵</button>
</div>
<main>
  <div class="fams" id="fams"></div>
  <div class="days" id="days" aria-label="Special day"></div>
  <div class="pkrow" id="pkrow"></div>
  <div class="grid" id="grid"></div>
  <p class="own">🎵 BeatCorner and 📷 Pose Party play their own music, so they have no mood.</p>
</main>
<div class="panel idle" id="panel">
  <div class="pin">
    <div class="now"><span id="now-t">👆 Tap a card to listen</span><span class="ly" id="now-l"></span></div>
    <div class="ten">😌 <input id="ten" type="range" min="0" max="100" value="0" aria-label="Tension"> 😬</div>
    <div class="acts">
      <button type="button" id="a-hush" data-sound="none">🤫 Robot thinks</button>
      <button type="button" id="a-sfx" data-sound="none">💥 Game sound</button>
      <button type="button" id="a-lift" data-sound="none">🎉 Big win</button>
      <button type="button" id="a-pause" data-sound="none">⏸ Pause</button>
      <button type="button" id="a-ramp" data-sound="none">⏱️ Run the clock</button>
      <button type="button" id="a-stop" data-sound="none">⏹ Stop</button>
    </div>
  </div>
</div>
<script>
const CURRENT_PLAYER = ''+__SP("player")+''; window.SP_PAGE = 'moodlab';
UI.applyTheme(UI.cachedTheme(CURRENT_PLAYER), {kitOnly: true});
const $ = id => document.getElementById(id);
const GAME_OF = {mathquest: 'Math Quest', numbergrid: 'Digitinct', numberboard: 'Algebros', wordboard: 'Lettercraft', georead: 'GeoRead', geoscout: 'GeoScout', eyesbrain: 'Eyes Brain Riot',
  memory: 'Memory / Memories Match', wisdeck: 'WisDeck', sweetswap: 'Sweet Swap', robotadventure: 'Code the Robot', stackingsim: 'Stack It!', pokadif: 'Pokadif', sciencetory: 'Sciencetory',
  artifactory: 'Artifactory', maze: 'Maze', blockdrop: 'Block Drop', popblocks: 'Pop Blocks', doubleup: 'Double Up', hopper: 'Dodgy Hopper', turbo: 'Turbo Trail', pinball: 'Pinball',
  minigames: 'Mini games', snakeast: 'Snakize', slabrall: 'SlaBrall', pyraspike: 'PyraDive', blasoff: 'BlasOff', brawlbuddies: 'Brawl Buddies', soulbopper: 'Soul Bopper',
  alignext: 'Alignext', chess: 'Chess', checkers: 'Checkers', polyplot: 'Polyplot', tdstories: 'TD-Stories', brawenture: 'Brawenture', avateer: 'Avateer', avateerbattle: 'Avateer battles'};
const FAM_ORDER = ['think', 'detective', 'climb', 'sport', 'arena', 'board', 'story'];
const FAM_LABEL = {think: '🧠 Think', detective: '🔬 Lab & detective', climb: '🏃 Arcade', sport: '🏟️ Sport', arena: '🥊 Arena', board: '♟️ Board', story: '📖 Story'};
const FAM_COL = {think: '#DDF1EF', detective: '#E8E4FB', climb: '#FDE3D7', sport: '#FFF1C9', arena: '#FBDCD9', board: '#EFE6DC', story: '#DFF0DA'};
const SCALE_NAME = {pent: 'pentatonic', minpent: 'minor pentatonic', dorian: 'dorian', lydian: 'lydian', major: 'major', minor: 'minor'};
let FAM = 'all', CUR = null, CUR_ID = '', ramp = 0, DAY = null;   // 🎊 24y-c: null = today's day (if any) · '' = none · key = that day
// back: names where it goes (◀ Dashboard when there is no trail)
$('back').textContent = UI.backLabel ? UI.backLabel() : '◀ Back';
$('back').onclick = () => { stop(); UI.back ? UI.back() : history.back(); };
// 🎵 this player's music on / off + volume
UISound.music.css();
const paintMus = st => { $('mus').classList.toggle('gb-mus-off', !st.on); $('mus').title = st.on ? 'Music: on' : 'Music: off'; };
paintMus(UISound.music.state()); UISound.music.watch(paintMus);
$('mus').onclick = () => UISound.music.sheet($('mus'));
function renderFams(){
  const box = $('fams'); box.innerHTML = '';
  [['all', '🎵 All']].concat(FAM_ORDER.map(f => [f, FAM_LABEL[f]])).forEach(([k, t]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'fam' + (FAM === k ? ' on' : ''); b.textContent = t; b.dataset.k = k;
    b.onclick = () => { FAM = k; box.querySelectorAll('.fam').forEach(x => x.classList.toggle('on', x.dataset.k === k)); renderGrid(); };
    box.appendChild(b);
  });
}
function renderGrid(){
  const g = $('grid'); g.innerHTML = '';
  const ids = Object.keys(UISound.MOODS).filter(k => UISound.MOODS[k] && (FAM === 'all' || UISound.MOODS[k].fam === FAM));
  ids.sort((a, b) => FAM_ORDER.indexOf(UISound.MOODS[a].fam) - FAM_ORDER.indexOf(UISound.MOODS[b].fam));
  ids.forEach(k => {
    const R = UISound.MOODS[k], b = document.createElement('button'); b.type = 'button'; b.className = 'card' + (k === CUR_ID ? ' on' : ''); b.dataset.k = k; b.setAttribute('data-sound', 'none');
    b.style.setProperty('--fc', FAM_COL[R.fam] || '#EEE');
    b.innerHTML = '<span class="ic"></span><span class="nm"></span><span class="gm"></span><span class="tg"></span><span class="fb"></span>';
    b.querySelector('.ic').textContent = R.icon; b.querySelector('.nm').textContent = R.name; b.querySelector('.gm').textContent = GAME_OF[k] || k;
    b.querySelector('.tg').textContent = R.key + ' ' + (SCALE_NAME[R.scale] || R.scale) + ' · ' + R.bpm + ' bpm · ' + R.lead;
    b.querySelector('.fb').textContent = (UISound.MOOD_FAMILIES[R.fam] || {}).icon || '';
    const pk = pickTag(k); if(pk){ const t = document.createElement('span'); t.className = 'pk'; t.textContent = pk; b.appendChild(t); }   // 🎵 24y-d: this player's pick
    b.onclick = () => toggle(k);
    g.appendChild(b);
  });
}
function lit(id, on){ $(id).classList.toggle('lit', !!on); }
function toggle(k){
  UISound.wake && UISound.wake();
  const was = CUR_ID; stop(); if(was === k) return;
  CUR = UISound.mood(k, DAY == null ? {} : {day: DAY, jingle: !!DAY}); CUR_ID = k;   // 🎊 24y-c: a picked day plays its jingle every time
  $('ten').value = 0; lit('a-hush', false); lit('a-pause', false); $('a-pause').textContent = '⏸ Pause';
  $('panel').classList.remove('idle');
  const R = UISound.MOODS[k];
  const D = UISound.DAYS && CUR.day ? UISound.DAYS[CUR.day] : null;
  $('now-t').textContent = '▶ ' + R.icon + ' ' + R.name + ' — ' + (GAME_OF[k] || k) + (D ? ' · ' + D.icon + ' ' + D.name : '');
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('on', c.dataset.k === k));
}
function stop(){
  clearInterval(ramp); ramp = 0;
  if(CUR) CUR.stop(); CUR = null; CUR_ID = '';
  $('panel').classList.add('idle'); $('now-t').textContent = '👆 Tap a card to listen'; $('now-l').textContent = ''; $('ten').value = 0;
  document.querySelectorAll('.card').forEach(c => c.classList.remove('on'));
}
$('ten').oninput = e => { if(CUR) CUR.set('tension', e.target.value / 100); };
$('a-hush').onclick = () => { if(!CUR) return; const on = !$('a-hush').classList.contains('lit'); lit('a-hush', on); CUR.hush(on); };
$('a-sfx').onclick = () => UISound.play('success');   // a real UiKit game sound → the music ducks under it
$('a-lift').onclick = () => { if(CUR) CUR.lift(); };
$('a-pause').onclick = () => { if(!CUR) return; const on = !$('a-pause').classList.contains('lit'); lit('a-pause', on); CUR.pause(on); $('a-pause').textContent = on ? '▶ Resume' : '⏸ Pause'; };
$('a-ramp').onclick = () => { if(!CUR) return; clearInterval(ramp); let v = 0; $('ten').value = 0; CUR.set('tension', 0);
  ramp = setInterval(() => { if(!CUR){ clearInterval(ramp); return; } v += 2; $('ten').value = v; CUR.set('tension', v / 100); if(v >= 100) clearInterval(ramp); }, 200); };
$('a-stop').onclick = stop;
// layers line (what is playing right now)
setInterval(() => {
  if(!CUR || !CUR.live){ if(CUR_ID && !(CUR && CUR.why === 'own-music')) $('now-l').textContent = CUR && !CUR.live ? '🔇 (silent here)' : ''; return; }
  const S = CUR.S; $('now-l').textContent = '🎚️ ' + Math.round(S.bpmNow) + ' bpm · ' + (S.paused ? 'paused' : (S.layers || '…'));
}, 250);
function renderDays(){   // 🎊 24y-c: hear any special day over any mood
  const box = $('days'); if(!box || !UISound.DAYS) return; box.innerHTML = '';
  const today = UISound.days ? UISound.days.on(new Date(), UISound.music.state().who) : '';
  [[null, '📅 Today' + (today ? ' ' + UISound.DAYS[today].icon : '')], ['', '🎵 No day']].concat(UISound.days.ORDER.map(k => [k, UISound.DAYS[k].icon + ' ' + UISound.DAYS[k].name])).forEach(([k, t]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'day' + (DAY === k ? ' on' : ''); b.textContent = t; b.dataset.k = k == null ? 'today' : k; b.setAttribute('data-sound', 'tap');
    b.onclick = () => { DAY = k; box.querySelectorAll('.day').forEach(x => x.classList.toggle('on', x === b)); const id = CUR_ID; if(id){ stop(); toggle(id); } };
    box.appendChild(b);
  });
}
function pickTag(k){   // 🎵 24y-d: '🎶 2 · 🎨 🌊' when this player picked something for that game
  const P = UISound.picks; if(!P || !P.on) return '';
  const p = P.get(k), W = UISound.WORLDS[p.s], t = p.t === 'own' ? '' : p.t === 'shuffle' ? '🎶 🔀' : '🎶 ' + (p.t + 1);
  return [t, W ? '🎨 ' + W.icon : ''].filter(Boolean).join(' · ');
}
function renderPicks(){   // 🎵 24y-d: the player's own picks on / off (for testing — tap 🎵 while a card plays to pick)
  const box = $('pkrow'); if(!box || !UISound.picks) return;
  const who = UISound.music.state().who || CURRENT_PLAYER || '';
  box.innerHTML = '<span></span><button type="button" data-sound="tap"></button>';
  box.querySelector('span').textContent = '👤 ' + (who || 'Guest') + "'s picks:";
  const b = box.querySelector('button'); const paint = () => { b.textContent = UISound.picks.on ? '🎵 On' : '🔕 Off — every game as it comes'; b.classList.toggle('on', !!UISound.picks.on); };
  b.onclick = () => { UISound.picks.on = !UISound.picks.on; paint(); renderGrid(); const id = CUR_ID; if(id){ stop(); toggle(id); } };
  paint();
}
renderFams(); renderGrid(); renderDays(); renderPicks();
try{ let tg = ''; UISound.music.watch(() => { const n = JSON.stringify(Object.keys(UISound.MOODS).map(pickTag)); if(n !== tg){ tg = n; renderGrid(); } }); }catch(e){}   // 🎵 24y-d: a pick in the 🎵 sheet shows on its card
window.MoodLab = {toggle: toggle, stop: stop, cur: () => CUR};
</script>
</body>
