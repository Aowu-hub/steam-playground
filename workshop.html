<style>
  /* Furniture Workshop page: the look + screens live in WorkshopKit (shared with My Room's in-room panel). */
  :root{--bg:#3B2414; --card:#FFFFFF; --panel:#FFF0E0; --ink:#3B2414; --ink-soft:#8A6A50; --terracotta:#F28C28; --mustard:#FFC845; --dusty-blue:#8A6A50;}

  body{margin:0;min-height:100%;min-height:100dvh;background:#FFF8F0;color:var(--ink);font-family:'Nunito',sans-serif;

<body ontouchstart="">
<button class="top-btn" id="back-btn" data-sound="none" onclick="WorkshopKit.goMyRoom()">🏠 My Room</button>
<button class="top-btn" id="show-btn" data-sound="none" onclick="WorkshopKit.goShowroom()">🏛️ My showroom</button>
<div class="wk" id="wk-root"></div>
<script>

const WEBAPP_URL = ''+__SP("webAppUrl")+'';
const CURRENT_PLAYER = ''+__SP("player")+''; window.SP_PAGE = 'workshop';
UI.applyTheme(UI.cachedTheme(CURRENT_PLAYER), {kitOnly: true});   // loader + menus in the player's look before the server answers
const SESSION_START = Number(''+__SP("sessionStart")+'') || null;
const DURATION_MIN = Number(''+__SP("durationMin")+'') || null;
const GAME_ID = 'workshop';
let lockHandle = null;
WorkshopKit.mount(document.getElementById('wk-root'), {mode: 'page'});
/* ================= BOOT ================= */
function boot(){
  UI.loading('workshop');
  google.script.run.withSuccessHandler(d => {
      UI.loaded();
      const st = d.settings || {}, lockOn = !(st.ScreenTimeLockEnabled === 'FALSE' || st.ScreenTimeLockEnabled === false);
      lockHandle = UI.screenTimeLock({sessionStart: SESSION_START, durationMin: DURATION_MIN, enabled: lockOn, homeUrl: WEBAPP_URL + '?page=home'});
      WorkshopKit.start(d, CURRENT_PLAYER);
    }).withFailureHandler(() => { UI.loaded(); UI.toast('Could not open the workshop — check the connection', 'err'); WorkshopKit.start({}, ''); })
    .getWorkshopData(CURRENT_PLAYER);
}
boot();
</script>
</body>
