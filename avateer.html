<style>
  /* ☁️ Sky Pop (plan §17n): sunny dawn sky, cloud-puff panels, chunky candy buttons */
  :root{--bg:#DFF4FF;--card:#FFFFFF;--panel:#F4FBFF;--ink:#2B2D42;--ink-soft:#5B6480;--terracotta:#FF8A2A;--mustard:#FFC21A;--dusty-blue:#5B6480;--game-a:#FF8A2A;--game-b:#2EC4B6;
    --sky:#8FD6F5;--dawn:#FFB7A0;--sun:#FFC21A;--jungle:#6BC95A;--magic:#9B5DE5;--th:'Mitr','Noto Sans Thai','Leelawadee UI','Thonburi',Tahoma,sans-serif;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);font-family:'Fredoka','Nunito',sans-serif;overscroll-behavior:none;}
  body.th .lt, body.th #goal, body.th .candy, body.th #toast, body.th #nm-card, body.th #emotes button{font-family:'Fredoka',var(--th);}
  #scr-play,#scr-play[data-theme]{--ink:#2B2D42 !important;--ink-soft:#5B6480 !important;color:#2B2D42;}   /* 🎨 av-pet1: Avateer's own bright world — dark ink under every look (Aowu 03:33) */
  #scr-play{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,#7FCDF2 0%,#BDE8FF 45%,#FFE3D2 85%,#FFD3B8 100%);}
  .cloud{position:absolute;font-size:64px;opacity:.85;filter:drop-shadow(0 6px 0 rgba(255,255,255,.35));animation:drift 60s linear infinite;pointer-events:none;}
  .cloud.c1{top:12%;left:-10%;animation-duration:70s;} .cloud.c2{top:38%;left:-20%;font-size:44px;animation-duration:90s;animation-delay:-30s;} .cloud.c3{top:70%;left:-15%;font-size:80px;animation-duration:110s;animation-delay:-60s;}
  @keyframes drift{from{transform:translateX(0);}to{transform:translateX(130vw);}}
  #iso{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  .puff{background:rgba(255,255,255,.92);border-radius:22px;box-shadow:0 8px 0 rgba(120,170,210,.28),0 14px 30px rgba(60,110,160,.18);}
  .candy{border:none;cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:700;font-size:.9rem;min-height:42px;min-width:42px;padding:6px 12px;border-radius:15px;color:var(--ink);
    background:linear-gradient(180deg,#FFFFFF,#E9F3FF);box-shadow:0 4px 0 #B9D3EC;transition:transform .08s;white-space:nowrap;}
  .candy:active,.candy.down{transform:translateY(3px) scale(.97);box-shadow:0 1px 0 #B9D3EC;}
  .candy.go{background:linear-gradient(180deg,#5EE0A0,#22A867);color:#fff;box-shadow:0 4px 0 #157A49;text-shadow:0 1px 1px rgba(0,0,0,.2);}
  .candy.on{background:linear-gradient(180deg,#FFB547,#FF8A2A);color:#fff;box-shadow:0 4px 0 #C85F12;}
  /* 🧭 top row: ◀ · 📖 tracker · 🎒 · 🇹🇭/EN */
  #top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));z-index:30;display:flex;gap:8px;align-items:flex-start;pointer-events:none;}
  #top > *{pointer-events:auto;}
  #trk{flex:0 1 auto;min-width:0;max-width:min(380px,calc(100vw - 210px));}
  #trk:empty{display:none;}
  #trk.row2{position:fixed;left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));max-width:none;display:flex;justify-content:center;}
  #trk.row2 > *{max-width:100%;}
  #right{margin-left:auto;display:flex;gap:6px;flex:0 0 auto;}
  #b-lang b{background:#2EC4B6;color:#fff;border-radius:9px;padding:1px 7px;margin:0 1px;} #b-lang span{opacity:.55;padding:0 3px;}
  #goal{position:absolute;left:50%;transform:translateX(-50%);z-index:18;background:rgba(43,45,66,.88);color:#fff;border-radius:16px;padding:7px 14px;font-weight:700;font-size:1rem;white-space:nowrap;
    box-shadow:0 6px 14px rgba(30,50,90,.25);pointer-events:none;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis;transition:opacity .3s;}
  #goal i{font-style:normal;background:#FFC21A;color:#2B2D42;border-radius:10px;padding:0 8px;margin-left:6px;}
  /* 🕹️ stick + 🦘 🎭 ⚔️ (pad rule: UiKit --pad-* sizes, the right buttons = the 🌸 petal ring) */
  #stick{position:absolute;left:calc(var(--pad-edge,24px) + env(safe-area-inset-left));bottom:calc(var(--pad-edge,24px) + var(--safe-b,0px));width:var(--pad-stick,150px);height:var(--pad-stick,150px);border-radius:50%;z-index:25;
    background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.75),rgba(255,255,255,.35));box-shadow:inset 0 0 0 4px rgba(255,255,255,.85),0 6px 0 rgba(90,140,190,.25);touch-action:none;}
  #stick .knob{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;background:linear-gradient(180deg,#FFB547,#FF8A2A);box-shadow:0 4px 0 #C85F12;pointer-events:none;}
  #btns{position:absolute;right:calc(var(--pad-edge,24px) + env(safe-area-inset-right));bottom:calc(var(--pad-edge,24px) + var(--safe-b,0px));z-index:25;}
  #b-swing.locked{filter:grayscale(.85);opacity:.72;} #b-swing.locked:after{content:'🔒';position:absolute;right:-4px;top:-6px;font-size:15px;}
  /* ✋ av-int1: the interact petal — dim with just ✋ until something is in reach, then gold + the action's word · desk key caps (E · Q · F · ␣) */
  #b-act.int-off .pz-pf{fill-opacity:.55;} #b-act.int-off .ic{opacity:.6;} #b-act.int-off .nm{opacity:.55;}
  #b-act.int-on .pz-pf{fill:#5A3E00;fill-opacity:.92;stroke:#FFD23F;stroke-width:4;} #b-act.int-on .nm{color:#FFE58A;}
  #b-swing.int-on:not(.locked) .pz-pf{stroke:#FF6B5B;stroke-width:5;}
  #btns .kc{display:inline-block;margin-left:4px;padding:0 4px;border-radius:5px;background:rgba(255,255,255,.88);color:#2B2D42;font:800 .9em/1.25 ui-monospace,Menlo,monospace;text-shadow:none;vertical-align:1px;}
  #b-act.int-no{animation:int-no .35s ease;} @keyframes int-no{25%{translate:-4px 0;}75%{translate:4px 0;}}
  #emotes{position:absolute;z-index:27;display:flex;gap:6px;padding:6px;border-radius:20px;}
  #emotes button{min-width:48px;min-height:48px;font-size:1.35rem;padding:4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;}
  #emotes button small{font-size:.62rem;font-weight:700;}
  #hand{position:absolute;z-index:28;font-size:40px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25));pointer-events:none;animation:poke .9s ease-in-out infinite;}
  @keyframes poke{0%,100%{translate:0 0;}50%{translate:-8px 4px;}}
  .stk{position:absolute;z-index:19;background:#fff;border-radius:14px;padding:4px 10px;font-weight:800;font-family:'Baloo 2',Fredoka,var(--th);font-size:17px;color:#9B5DE5;box-shadow:0 4px 0 rgba(155,93,229,.35);
    transform:translate(-50%,-100%) rotate(-6deg);white-space:nowrap;pointer-events:none;animation:stk 1.4s ease-out forwards;}
  .stk:after{content:'';position:absolute;left:18px;bottom:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0;}
  @keyframes stk{0%{opacity:0;scale:.6;}12%{opacity:1;scale:1.08;}22%{scale:1;}80%{opacity:1;}100%{opacity:0;translate:0 -14px;}}
  #toast{position:absolute;left:50%;bottom:calc(var(--safe-b,0px) + 24px);transform:translateX(-50%);z-index:40;background:rgba(43,45,66,.9);color:#fff;border-radius:16px;padding:9px 16px;font-weight:700;
    max-width:calc(100vw - 40px);text-align:center;pointer-events:none;opacity:0;transition:opacity .3s;}
  #toast.on{opacity:1;}
  body.talking #top, body.talking #stick, body.talking #btns, body.talking #goal, body.talking #emotes, body.talking #hand{visibility:hidden !important;}
  /* 🃏 av-s1b: the battle + creation screens cover the map HUD · ⭐ Lv chip */
  body.battling #top, body.battling #stick, body.battling #btns, body.battling #goal, body.battling #emotes, body.battling #hand, body.battling #trk, body.battling .sp-topnav, body.battling #toast{visibility:hidden !important;}
  .lvchip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:52px;min-height:42px;padding:3px 8px;border-radius:15px;background:rgba(255,255,255,.92);box-shadow:0 4px 0 #B9D3EC;font-weight:800;font-size:.8rem;line-height:1;}
  .lvchip:empty{display:none;} .lvchip i{display:block;width:40px;height:6px;border-radius:4px;background:#E3EEF8;overflow:hidden;} .lvchip i u{display:block;height:100%;background:linear-gradient(90deg,#FFC21A,#FF8A2A);} .lvchip small{font-size:.68rem;font-weight:700;}
  body.talking .sp-topnav, body.lw-open .sp-topnav{visibility:hidden !important;}
  body.lw-open #top, body.lw-open #goal{visibility:hidden !important;}
  /* 🏷️ name your traveller */
  #nm{position:absolute;inset:0;z-index:65;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(60,110,160,.28);}
  #nm-card{width:min(420px,100%);padding:20px 18px 16px;text-align:center;}
  #nm-card h2{margin:0 0 4px;font-family:'Baloo 2','Fredoka',var(--th);font-size:1.55rem;} #nm-card p{margin:0 0 12px;color:var(--ink-soft);font-weight:600;}
  #nm-in{width:100%;font:700 1.35rem 'Fredoka',var(--th);text-align:center;padding:10px 12px;border-radius:16px;border:3px solid #BFE0F7;outline:none;background:#F4FBFF;color:var(--ink);}
  #nm-in:focus{border-color:#FF8A2A;} #nm-bad{min-height:1.3em;color:#E5484D;font-weight:700;font-size:.85rem;margin:6px 0;}
  #nm-av{display:block;margin:0 auto 6px;width:96px;height:110px;}
  #loading{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(180deg,#7FCDF2,#FFE3D2);transition:opacity .35s;}
  #loading .ic{font-size:3.2rem;animation:bob 1s ease-in-out infinite;} #loading p{margin:0;font-weight:700;}
  #loading .bar{width:220px;height:12px;border-radius:99px;background:#fff;overflow:hidden;} #loading .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFC21A,#FF8A2A);transition:width .15s;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-8px) rotate(5deg);}}
  .hidden{display:none !important;}
  @media (max-width:600px){ #trk{max-width:calc(100vw - 168px);} .candy{min-height:40px;padding:5px 9px;font-size:.82rem;} .candy .bl{display:none;} #goal{font-size:.9rem;} }
  @media (max-height:430px){ .candy{min-height:38px;padding:4px 9px;} #goal{font-size:.82rem;padding:5px 11px;} #emotes button{min-height:44px;min-width:44px;} }
  @media (prefers-reduced-motion: reduce){ .cloud,#hand,#loading .ic{animation:none;} }
  /* 📂 av-s1c: the 3 travel files over the cover */
  #av-files{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;background:rgba(20,30,50,.45);padding:12px;}
  #av-files .avf-card{width:min(720px,100%);max-height:100%;overflow:auto;background:#FFFDF6;border-radius:20px;padding:10px 14px 14px;box-shadow:0 10px 30px rgba(0,0,0,.3);}
  #av-files .avf-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px;} #av-files .avf-hd b{flex:1;font-size:1.15rem;}
.arr-skip{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:60;background:rgba(43,45,66,.74);color:#fff;font:700 14px Fredoka,var(--th,Sarabun),sans-serif;padding:8px 16px;border-radius:999px;pointer-events:none;animation:arrIn .4s ease-out both}@keyframes arrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}   /* 🛶 av-boat */
</style>

/* ---------- 💾 save — av-s1c: 3 files (GF.saves): device copy at once 'sp_save:avateer:<Name>:<slot>' = {meta, data, at} · the server file of the same slot at the inn + when you leave; a newer copy wins.

  try { google.script.run.withSuccessHandler(f => end(f && f.data && f.data.v === 1 ? f.data : null)).withFailureHandler(() => end(null)).loadGameFile(CURRENT_PLAYER, GAME_ID, slot || G.slot || 1); } catch(e){ end(null); } }); }

/* ---------- 🏷️ name your traveller (≤ 10 letters, kid-safe; the login name to start) ---------- */
const BAD = ['poop', 'butt', 'stupid', 'idiot', 'kill', 'dead', 'hate', 'sex', 'fuck', 'shit', 'damn', 'ควย', 'เหี้ย', 'สัส', 'มึง', 'โง่', 'ตาย', 'ฆ่า'];
function cleanName(s){ s = String(s || '').replace(/[^\p{L}\p{M}\p{N} ]/gu, '').replace(/\s+/g, ' ').trim(); const a = Array.from(s); return a.slice(0, 10).join('').trim(); }
function okName(s){ const l = s.toLowerCase(); return s.length > 0 && !BAD.some(b => l.indexOf(b) >= 0); }
function askName(){ return new Promise(res => { const box = $('nm'), inp = $('nm-in'); $('nm-h').textContent = w('nameH'); $('nm-p').textContent = w('nameP'); $('nm-go').textContent = w('nameGo'); $('nm-bad').textContent = '';
  inp.value = cleanName(G.save.name || CURRENT_PLAYER || ''); box.classList.remove('hidden');
  const c = $('nm-av'), g = c.getContext('2d'); g.clearRect(0, 0, c.width, c.height); try { drawAvatar(g, {av: G.heroBase, name: inp.value || 'You', dir: 1}, 96, 206, 2.3, {t: 1, still: true, pose: {face: 'happy'}}); } catch(e){}
  const go = () => { const n = cleanName(inp.value); if(!okName(n)){ $('nm-bad').textContent = w('nameBad'); sound('nope'); return; } box.classList.add('hidden'); sound('tap'); res(n); };
  $('nm-go').onclick = go; inp.onkeydown = e => { if(e.key === 'Enter') go(); }; setTimeout(() => { try { inp.focus(); inp.select(); } catch(e){} }, 60); }); }

function baseAv(){ let av = null; try { const s = JSON.parse(localStorage.getItem('sp_av:' + CURRENT_PLAYER) || 'null'); if(s) av = s; } catch(e){} return av || defaultAvatar(CURRENT_PLAYER || 'Traveller'); }
function who(){ return {av: G.heroAv, name: G.save.name || 'You', dir: G.H.dir}; }
function drawHero(g, sx, sy, k){ if(G.arr && G.arr.seat) return;   /* 🛶 av-boat: in the boat */
  const H = G.H, J = G.J, sc = k * AK, air = J && J.on ? J.air : (H.hop >= 0 ? Math.sin(Math.min(1, H.hop / 0.5) * Math.PI) : 0);

  const lift = air * 34 * k;
  if(G.act && !G.act.run.done){ Acting.draw(g, who(), sx, sy - lift, sc, G.act.run.at(G.t), {t: G.t}); if(G.act.key === 'avateer.breathe') balloon(g, sx + H.dir * 15 * k, sy - 50 * k, k, (G.t - G.act.t0) * 1000); return; }
