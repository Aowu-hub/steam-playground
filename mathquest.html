<style>
  /* Math Quest keeps its own look in play (each world brings its colours); menus follow the player's look. */
  :root{
    --bg:#1F3A68; --card:#FFFFFF; --panel:#EAF3FF; --ink:#1E2B4A; --ink-soft:#5B6C8F;
    --pink:#FF4D8D; --violet:#5B4BE0; --gold:#FFC845; --mint:#2EC4B6; --green:#4CB963; --danger:#E5484D;
    --terracotta:#3D7DD8; --mustard:#FFC845; --dusty-blue:#5B6C8F; /* used by UiKit */
    --w1:#FFE8B8; --w2:#FF9F68; --wink:#2B2250; --wcard:rgba(255,255,255,0.92);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{height:100%;background:#F2F7FF;}
  body{margin:0;min-height:100%;min-height:100dvh;background:#F2F7FF;color:var(--ink);font-family:'Nunito',sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overscroll-behavior:none;}
  .hidden{display:none !important;}
  h1,h2,h3{font-family:'Fredoka',sans-serif;margin:0;}
  button{font-family:inherit;}
  .top-btn{position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));z-index:300;
    border:none;border-radius:14px;background:var(--card);color:var(--ink-soft);cursor:pointer;padding:8px 12px;
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:0.82rem;box-shadow:0 3px 0 rgba(0,0,0,0.08);}
  /* ---------- menus ---------- */
  .screen{max-width:960px;margin:0 auto;padding:62px 18px 40px;}
  .title{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;margin-bottom:12px;}
  .title h1{font-size:2rem;} .title p{margin:0;color:var(--ink-soft);font-weight:700;}
  .title .logo{font-size:2.8rem;animation:mqlogo 2.4s ease-in-out infinite;}
  @keyframes mqlogo{0%,100%{transform:rotate(-6deg) scale(1);}50%{transform:rotate(6deg) scale(1.08);}}
  .who{display:inline-flex;align-items:center;gap:8px;margin-top:6px;background:var(--card);border-radius:14px;padding:6px 12px;font-weight:800;font-size:0.85rem;}
  .who button{border:none;background:none;color:var(--pink);font-weight:800;cursor:pointer;font-size:inherit;text-decoration:underline;padding:0;}
  .pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;}
  .pick{background:var(--card);border:3px solid transparent;border-radius:20px;padding:14px 10px;cursor:pointer;position:relative;
    display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,0.07);color:inherit;}
  .pick:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,0.07);}
  .pick .big{font-size:2.2rem;line-height:1;} .pick .nm{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1rem;} .pick .sub{font-size:0.75rem;color:var(--ink-soft);font-weight:700;}
  .pick canvas{width:72px;height:84px;}
  .section-head{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.05rem;margin:16px 0 8px;color:var(--ink-soft);text-align:center;}
  /* series + world pickers: one row each, scroll sideways on phones */
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .chip{border:3px solid transparent;border-radius:16px;background:var(--card);color:var(--ink);cursor:pointer;padding:8px 12px;min-height:48px;
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:0.95rem;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 0 rgba(0,0,0,0.07);}
  .chip .ic{font-size:1.4rem;line-height:1;}
  .chip.on{border-color:var(--pink);background:#FF4D8D;color:#fff;}
  .lvl.challenge{background:linear-gradient(135deg,#1E3A8A,#2EC4B6) !important;color:#fff !important;} .lvl.challenge *{color:#fff !important;} .lvl.challenge.locked{filter:grayscale(.5);opacity:.7;}
  .lvl.challenge{grid-column:1/-1;} .lvl.challenge .big{font-size:2rem;} .lvl.challenge .lives,.lvl.challenge .best span{background:rgba(255,255,255,0.18) !important;color:#fff !important;}
  .chip .mult{font-size:0.7rem;font-weight:900;margin-left:5px;background:#FFC845;color:#3A2500;border-radius:8px;padding:1px 6px;}
  html .chip.on .mult{color:#3A2500 !important;}
  /* the picked maths + world must stay visible in every look (looks restyle cards, which hid the pick) */
  html .chip.on, html [data-theme] .chip.on, html .chip.on.t-card{background:linear-gradient(135deg,#FF4D8D,#FF8A3D) !important;color:#fff !important;border-color:#FFE066 !important;box-shadow:0 0 0 3px rgba(255,224,102,0.55),0 4px 0 rgba(0,0,0,0.2) !important;position:relative;}
  html .chip.on *{color:#fff !important;}
  /* iPad Safari inside the Apps Script frame sometimes skips repainting a chip whose class changed: each chip + level card gets its own layer (2026-11-03) */
  .chips, .chip, .levels .lvl{transform:translateZ(0);-webkit-transform:translateZ(0);backface-visibility:hidden;-webkit-backface-visibility:hidden;}
  .chip.pick:active, .levels .lvl.pick:active, .chip:active{transform:translateZ(0) translateY(4px);}
  .chip.on::after{content:'✓';position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#2EC4B6;color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,0.2);}
  .worlds .chip{flex-direction:column;gap:2px;min-width:104px;padding:8px 10px;}
  .worlds .chip .ic{font-size:1.8rem;} .worlds .chip small{font-size:0.66rem;font-weight:800;opacity:.85;}
  @media (max-width:640px){ .chips{padding:4px 2px 2px;gap:6px;} .chip{flex:0 1 auto;min-width:0;padding:6px 9px;} }   /* 📏 p2: chips wrap (pages with dots when long), never a sideways row */
  .levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media (min-width:1100px){ .levels{grid-template-columns:repeat(6,1fr);} }
  @media (max-width:640px){ .levels{grid-template-columns:repeat(2,1fr);} .title h1{font-size:1.6rem;} }
  .lvl .num{position:absolute;top:8px;left:10px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:0.75rem;color:var(--ink-soft);}
  .lvl .badge{position:absolute;top:6px;right:8px;font-size:1rem;}
  .lvl.recommended{border-color:var(--mint);}
  .mq-th .lvl.recommended::after{content:'เหมาะกับเธอ!';}   /* ➗ mq-t4b */
  .lvl.recommended::after{content:'Great for you!';position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--mint);color:#fff;font-size:0.62rem;font-weight:800;padding:2px 8px;border-radius:8px;}
  .lvl.locked{opacity:.55;cursor:not-allowed;filter:grayscale(.6);}
  .lvl .learn{font-size:0.7rem;font-weight:800;color:var(--pink);}
  .lvl .lives{font-size:0.66rem;font-weight:800;background:var(--panel);border-radius:10px;padding:2px 6px;}
  .lvl .best{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 8px;font-size:0.74rem;font-weight:800;}
  .lvl .best span{background:var(--panel);border-radius:10px;padding:2px 8px;} .lvl .best.none{color:var(--ink-soft);}
  .lvl.hardcore{background:linear-gradient(160deg,#7A1020 0%,#2E0609 62%,#0E0204 100%) !important;color:#FFECEC !important;border-color:#FF4040 !important;}
  .lvl.hardcore .nm,.lvl.hardcore .sub,.lvl.hardcore .num,.lvl.hardcore .learn,.lvl.hardcore .lives,.lvl.hardcore .best,.lvl.hardcore .best.none{color:#FFECEC !important;}
  .lvl.hardcore .best span,.lvl.hardcore .lives{background:rgba(255,255,255,0.16) !important;color:#FFECEC !important;}
  .lvl.hardcore .big{filter:drop-shadow(0 0 8px rgba(255,64,64,0.85));}
  .lvl.hardcore:not(.locked){box-shadow:0 0 0 2px #FF4040,0 0 18px rgba(255,64,64,0.45) !important;}
  .lvl.hardcore.locked{opacity:.8;filter:grayscale(.3);}
  .rules{background:var(--card);border-radius:18px;padding:8px 14px;margin-top:16px;}
  .rules summary{cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:700;padding:6px 0;}
  .rules li{margin:5px 0;font-size:0.9rem;}
  .empty{text-align:center;color:var(--ink-soft);font-weight:800;padding:20px;}

  /* ---------- play ---------- */
  #scr-play{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--w1),var(--w2));color:var(--wink);overflow:hidden;}
  #scr-play.dark{--wink:#FFFFFF;--wcard:rgba(20,16,60,0.72);}
  .pill{background:rgba(0,0,0,0.28);border:none;color:#fff;border-radius:14px;padding:6px 10px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:0.9rem;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
  button.pill{cursor:pointer;min-width:40px;min-height:36px;justify-content:center;} button.pill:active{transform:translateY(2px);}
  .pill.lvl-pill{background:linear-gradient(135deg,#3D7DD8,#5B4BE0);} .pill.lvl-pill.hc{background:linear-gradient(135deg,#B3122B,#3A0A10);}
  .pill.score{font-size:1.05rem;min-width:84px;justify-content:center;}
  .pill.hot{background:linear-gradient(135deg,#FF9F1C,#FF4D8D);animation:pulse .7s ease-in-out infinite;}
  .pill.warn{background:var(--danger);animation:pulse .8s ease-in-out infinite;} @keyframes pulse{50%{transform:scale(1.08);}}
  .timebar{height:8px;margin:0 12px 4px;border-radius:6px;background:rgba(0,0,0,0.16);overflow:hidden;flex:none;}
  .timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#4CB963,#FFC845);border-radius:6px;transition:width .25s linear;}
  .timebar.low i{background:linear-gradient(90deg,#E5484D,#FF9F1C);}
  .arena{flex:1;min-height:0;display:grid;grid-template-rows:1fr auto;gap:10px;padding:4px 12px var(--safe-b, 18px);max-width:920px;width:100%;margin:0 auto;position:relative;}
  .qcard{position:relative;min-height:0;background:var(--wcard);border-radius:26px;padding:12px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 0 rgba(0,0,0,0.12);overflow:hidden;}
  .qcard.pop{animation:qpop .35s cubic-bezier(.2,1.6,.4,1);}
  @keyframes qpop{0%{transform:scale(.92);opacity:.4;}100%{transform:scale(1);opacity:1;}}
  .qcard.shake{animation:shake .45s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-9px) rotate(-1deg);}40%{transform:translateX(9px) rotate(1deg);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
  .qno{position:absolute;top:8px;left:12px;font-weight:800;font-size:0.8rem;opacity:.7;}
  .mascot{position:absolute;top:4px;right:10px;font-size:2rem;line-height:1;transition:transform .2s;}
  /* 🧑 p6e: your avatar */
  @media (orientation:landscape) and (max-height:520px){ .qcard:has(#word.story:not(.hidden)) .say-btn{top:2px;bottom:auto;right:96px;width:34px;height:34px;font-size:1rem;border-radius:11px;} }   /* ➗ mq-t2b: 🔊 up in the top strip — never on the picture */
  .qcard #bd-lg{position:absolute;top:2px;right:64px;width:40px;height:46px;pointer-events:none;}   /* ➗ mq-t2b: room between the buddy and the 🦉 */
  @media (orientation:landscape) and (max-height:520px){ .qcard #bd-lg{right:54px;width:32px;height:38px;} }
  .result-card .res-av{width:128px;height:140px;display:block;margin:0 auto -2px;}
  .mascot.happy{animation:hop .5s ease;} .mascot.sad{animation:droop .6s ease;}
  @keyframes hop{30%{transform:translateY(-14px) rotate(-10deg) scale(1.15);}60%{transform:translateY(0) rotate(6deg);}}
  @keyframes droop{40%{transform:rotate(-18deg) translateY(4px);}}
  .say-btn{position:absolute;bottom:8px;right:10px;border:none;border-radius:14px;background:rgba(0,0,0,0.12);color:inherit;font-size:1.3rem;width:46px;height:46px;cursor:pointer;}
  .word{font-weight:800;font-size:clamp(1rem,min(3vw,3vh),1.5rem);text-align:center;max-width:620px;line-height:1.35;}
  .eq{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(2rem,min(10vw,9vh),5rem);line-height:1.1;text-align:center;letter-spacing:1px;}
  .eq .q{display:inline-block;min-width:1.2em;padding:0 .2em;border-radius:14px;background:rgba(255,200,69,0.45);animation:qmark 1.2s ease-in-out infinite;}
  @keyframes qmark{50%{background:rgba(255,200,69,0.85);}}
  .eq .q.got{background:#4CB963;color:#fff;animation:none;}
  /* picture numbers */
  .vis{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;max-width:100%;--vs:2rem;}
  .grp{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:min(46vw,420px);font-size:var(--vs);line-height:1.25;}
  .grp span{display:inline-block;animation:drop .4s cubic-bezier(.2,1.6,.4,1) both;}
  .grp span.gone{opacity:.28;position:relative;} .grp span.gone::after{content:'✖';position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);color:#E5484D;font-size:.8em;opacity:1;}
  @keyframes drop{0%{transform:translateY(-14px) scale(.4);opacity:0;}100%{transform:none;opacity:1;}}
  .op{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(2rem,7vmin,3.4rem);}
  .arr{display:grid;gap:3px;font-size:var(--vs);line-height:1.2;}
  .baskets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .basket{display:flex;flex-direction:column;align-items:center;font-size:calc(var(--vs) * 1.2);}
  .basket b{font-family:'Fredoka',sans-serif;font-size:clamp(1rem,3vmin,1.5rem);background:rgba(255,200,69,0.6);border-radius:10px;padding:0 8px;}
  .nline{width:100%;max-width:640px;height:70px;}
  .nline text{font-family:'Fredoka',sans-serif;font-weight:700;font-size:12px;fill:currentColor;}
  .hintline{font-weight:800;font-size:0.85rem;opacity:.8;}
  .answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .answers.three{grid-template-columns:repeat(3,1fr);}
  .ans{border:none;border-radius:22px;min-height:76px;cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.6rem,6vw,2.4rem);
    color:#1E2B4A;background:#FFFFFF;box-shadow:0 6px 0 rgba(0,0,0,0.18);position:relative;transition:transform .08s;}
  .ans:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,0.18);}
  .ans .k{position:absolute;top:6px;left:10px;font-size:0.7rem;opacity:.45;}
  .ans.right{background:#4CB963;color:#fff;animation:jelly .5s ease;} .ans.wrong{background:#E5484D;color:#fff;animation:shake .4s ease;}
  .ans.off{opacity:.25;pointer-events:none;} .ans.show{box-shadow:0 0 0 4px #4CB963,0 6px 0 rgba(0,0,0,0.18);}
  @keyframes jelly{30%{transform:scale(1.12,0.9);}60%{transform:scale(0.95,1.08);}100%{transform:scale(1);}}
  .tools{display:flex;gap:8px;justify-content:center;}
  .tool{border:none;border-radius:14px;background:rgba(255,255,255,0.85);color:#1E2B4A;cursor:pointer;padding:8px 14px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:0.95rem;min-height:44px;box-shadow:0 3px 0 rgba(0,0,0,0.12);}
  .tool:disabled{opacity:.4;cursor:default;}
  /* phones held sideways: question left, answers right */
  @media (orientation:landscape) and (max-height:520px){
    .arena{grid-template-rows:1fr;grid-template-columns:1.25fr 1fr;align-items:stretch;}
    .side-col{display:flex;flex-direction:column;justify-content:center;gap:8px;}
    .ans{min-height:58px;} .eq{font-size:clamp(1.6rem,6vh,2.6rem);} .vis{--vs:1.4rem;} .mascot{font-size:1.5rem;}
    .hud{padding-top:calc(4px + env(safe-area-inset-top));} .pill{padding:4px 8px;font-size:0.8rem;}
  }
  .side-col{display:flex;flex-direction:column;gap:8px;}
  @media (orientation:landscape) and (max-height:520px){ .qcard:has(#word.story:not(.hidden)) + .side-col{justify-content:flex-start;} .qcard:has(#word.story:not(.hidden)) + .side-col .ans{min-height:clamp(58px,19vh,92px);} }   /* ➗ mq-t2b: reading cards — answers start at the top, no empty block above */
  .banner{position:absolute;left:50%;top:30px;transform:translateX(-50%);z-index:20;pointer-events:none;width:max-content;max-width:min(92vw,440px);text-align:center;
    background:rgba(25,10,45,0.85);color:#fff;border-radius:14px;padding:8px 14px;font-family:'Fredoka',sans-serif;font-weight:700;opacity:0;transition:opacity .25s;}
  .qcard:has(#word.story:not(.hidden)){padding-top:50px;} .qcard:has(#word.story:not(.hidden)) > :is(#word, #vis, #eq, #hintline){flex-shrink:0;} .qcard:has(#word.story:not(.hidden)) .hintline{max-width:calc(100% - 128px);text-align:center;}   /* ➗ mq-t2: reading cards keep clear of the number / 🦉 / buddy strip and the 🔊 */
  @media (orientation:landscape) and (max-height:520px){ .qcard:has(#word.story:not(.hidden)){padding-top:42px;} }
  .banner.on{opacity:1;} .banner.top{position:fixed;top:max(8px,env(safe-area-inset-top));z-index:70;font-size:clamp(.9rem,2.4vw,1.1rem);box-shadow:0 4px 14px rgba(0,0,0,.25);}   /* ➗ mq-t2: reading cards */ .banner.gold{background:linear-gradient(135deg,#FF9F1C,#FF4D8D);} .banner.bad{background:rgba(229,72,77,0.95);}
  .praise{position:fixed;left:50%;top:38%;z-index:30;transform:translate(-50%,-50%);pointer-events:none;text-align:center;white-space:nowrap;font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.4rem,5vw,2.6rem);color:#fff;
    padding:12px 22px;border-radius:22px;background:linear-gradient(135deg,#3D7DD8,#2EC4B6,#5B4BE0);box-shadow:0 8px 0 rgba(0,0,0,0.25);animation:praise-in .7s cubic-bezier(.2,1.6,.4,1) both;}
  @keyframes praise-in{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0;}100%{transform:translate(-50%,-50%) scale(1);opacity:1;}}
  .spark{position:fixed;z-index:50;pointer-events:none;font-size:1.3rem;animation:spark .8s ease-out forwards;}
  @keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0;}}
  .float{position:fixed;z-index:51;pointer-events:none;font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.4rem;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,0.35);animation:floatup .9s ease-out forwards;}
  @keyframes floatup{to{transform:translateY(-60px);opacity:0;}}
  /* result */

function young(age){ return age === '4-5' || age === '6-7'; }
function pictures(lvl, age){ return lvl <= 1 || (lvl === 2 && young(age)); }
const NO_TEN = [2, 3, 4, 5, 6, 7, 8, 9, 11, 12];   // the other number in a table sum: never the easy 10
function makeNums(op, lvl, Lx){
  const L = Lx || LEVELS[lvl]; let a, b, ans;
  // no '0 + n' or 'n − 0' sums: both numbers are at least 1
  if(op === 'add'){ const max = L.add, lo = L.big ? 100 : lvl >= 3 ? 10 : 2; ans = randInt(lo, max); a = randInt(Math.max(1, lvl >= 3 ? Math.floor(ans * 0.2) : 1), ans - 1); b = ans - a; }
  else if(op === 'sub'){ const max = L.add, lo = L.big ? 100 : lvl >= 3 ? 10 : 2; a = randInt(lo, max); b = randInt(1, a - (lvl <= 1 ? 0 : 1)); ans = a - b; }
  else if(op === 'mul'){
    if(L.big && Math.random() < 0.45){ a = randInt(11, lvl === 5 ? 99 : 49); b = randInt(2, 9); }   // 2-digit × 1-digit
    else if(L.tables){ a = pick(L.tables); b = pick(NO_TEN); }   // the hard tables (Hard 7 8 9 11 12 13 · Extreme 9 12–17 · no easy 10s)
    else { a = randInt(lvl === 0 ? 1 : 2, L.mul[0]); b = randInt(lvl <= 1 ? 1 : 2, L.mul[1]); }
    if(Math.random() < 0.5 && !(L.big && a > 12) && !(L.tables && a > 12)){ const t = a; a = b; b = t; }
    ans = a * b;
  } else {   // div: always a whole answer
    const d = L.tables ? pick(L.tables) : randInt(2, L.div[0]), q = L.tables ? pick(NO_TEN) : randInt(lvl <= 1 ? 1 : 2, L.div[1]); a = d * q; b = d; ans = q;
  }
  return {op, a, b, ans};
}
function makeQ(series, lvl, world, age, Lx, mode){
  const L = Lx || LEVELS[lvl], W = WORLDS[world] || WORLDS.school;
  if(isWordMode(mode)){ const wq = makeWordQ(mode, series, lvl, world, age, L); wq.key = qKey(wq); return wq; }   // ➗ mq-w1
  if(isStoryMode(mode)) return makeStoryQ(mode, series, lvl, world, age, L);   // ➗ mq-w2 📖
  if(isTrickMode(mode)){ const tq = makeTrickQ(mode, lvl, L); if(tq) return tq; }   // ➗ mq-w3 🤔
  if(isTestMode(mode)){ const tt = makeTestQ(mode, lvl, L); if(tt) return tt; }   // ➗ mq-t1 📝
  if(isPzMode(mode)){ const pq = makePzQ(mode, lvl, L); if(pq) return pq; }   // ➗ mq-w4 ❓ 🔍 🕐
  const op = series === 'mix' ? pick(lvl === 0 ? ['add', 'sub', 'add', 'sub', 'mul', 'div'] : OPS) : series;
  const q = makeNums(op, lvl, L);
  q.missing = ''; q.word = ''; q.vis = null;
  if(L.missing && Math.random() < L.missing){ q.missing = Math.random() < 0.5 ? 'a' : 'b'; }
  if(!q.missing && L.words && Math.random() < L.words){ q.word = storyText(q, W); }
  if(pictures(lvl, age) && !q.word && !q.missing) q.vis = visFor(q, W, lvl);
  q.ask = q.missing === 'a' ? q.a : q.missing === 'b' ? q.b : q.ans;   // the number the child has to find
  q.choices = choicesFor(q, L.choices);
  q.key = qKey(q);   // ➗ mq-w1: 🎲 recent-question memory
  if(isListenMode(mode)){ q.word = ''; q.vis = null; q.listen = true; q.lang = mode === 'listenth' ? 'th' : 'en'; q.say = q.lang === 'th' ? thaiSayText(q) : sayText(q); q.key += '-l'; }   // ➗ mq-w5 🎧 heard, not read
  return q;
}

function storyX(world, lvl, needBuy){

  X.be = n => n === 1 ? 'is' : 'are';

  X.tinB = () => (X.B.tp || 'ใน') + X.B.t;
  X.eGroups = (a, b) => fN(a) + ' ' + (a === 1 ? X.B.e : X.B.ep) + ' with ' + X.en(b) + ' ' + (X.B.on ? 'on' : 'in') + ' each';
  X.tGroups = (a, b) => X.B.t + ' ' + fN(a) + ' ' + X.B.c + ' ' + X.B.v + X.N.t + X.B.c + 'ละ ' + X.tn(b);
  X.out = n => X.N.alive ? (n === 1 ? 'leaves' : 'leave') : (n === 1 ? 'is taken out' : 'are taken out');

function flushPending(){ const list = readPending(); if(!list.length) return; writePending([]); list.forEach(w => google.script.run.withFailureHandler(() => writePending(readPending().concat([w]))).saveLevelResult(GAME_ID, w.name, w.lvl, w.extra)); }
function putNote(html){ const put = () => { const n = $('save-note'); if(n) n.innerHTML = html; return !!n; }; if(!put()) setTimeout(put, 1700); }
function saveWin(name, lvlIdx, extra, tries){
  tries = tries || 0;
  const p = S.progress[name] || (S.progress[name] = {unlocked: 0, tokens: [], best: []});
  if(extra.cleared) p.unlocked = Math.max(p.unlocked, lvlIdx + 1);
  google.script.run.withSuccessHandler(res => {
      const best = (p.best || []).slice(); if(res.best) best[lvlIdx] = res.best;
      S.progress[name] = {unlocked: res.unlocked, tokens: res.tokens, best}; flushPending(); putNote(saveText(res));
    }).withFailureHandler(err => {
      if(tries < 1){ setTimeout(() => saveWin(name, lvlIdx, extra, tries + 1), 1200); return; }
      writePending(readPending().concat([{name, lvl: lvlIdx, extra}])); putNote('⚠️ Could not save yet — it will be sent again next time.');
    }).saveLevelResult(GAME_ID, name, lvlIdx, extra);
}
function saveText(res){
  let h = res.newBadge ? '<span class="new-badge">🏅 New badge: ' + UI.esc(res.newBadge) + '</span>' : res.newHighScore && !res.firstTime ? '🎉 New high score!' : res.best && res.best.score ? 'Your best: 🏆 ' + Number(res.best.score).toLocaleString() : '✅ Score saved';
  const fe = res.feats; if(fe){ (fe.newTitles || []).forEach(t => { h += '<br><span class="title-new">🏷️ New title: ' + t.icon + ' ' + UI.esc(t.name) + '</span>'; }); (fe.newBadges || []).forEach(b => { h += '<br><span class="feat-new">' + b.medal + ' ' + b.icon + ' ' + UI.esc(b.name) + ' · ' + b.tierName + '</span>'; }); }
  return h;
}
function countUp(el, to, ms){ if(!el) return; const t0 = performance.now(); (function tick(now){ const p = Math.max(0, Math.min(1, (now - t0) / ms)); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))).toLocaleString(); if(p < 1) requestAnimationFrame(tick); })(t0); }
/* 📣 CHEERSQUAD (cs-4b) START — the crowd beside the play (CheerSquad.html, 📣 Cheer chat). Don't remove: the Cheer chat re-applies it. */
// solo: you = side 0, the 😈 rival = side 1. Fans stand only where the bar, the question / board and the controls leave room.
function cheerTaken(){ return Array.from(document.querySelectorAll('#gbar, .top-btn, #timebar, #qcard, #scr-play .side-col')); }
function cheerHard(){ return cheerTaken(); }
function cheerMount(){
  if(!window.Cheer) return; Cheer.unmount(); if(!(G)) return; const box = $('scr-play'); if(!box) return;
  Cheer.mount(box, {game: 'mathquest', players: [{name: S.player, side: 0, human: true}, {name: 'Rival', side: 1, human: false}], me: {name: S.player}, family: (S.players || []).map(p => p.Name), avatars: S.avatars || {}, mode: 'overlay',
    zones: () => Cheer.freeZones(box, cheerTaken), avoid: cheerHard,
    clear: b => { const B = box.getBoundingClientRect(); return !cheerHard().some(e => { const r = e.getBoundingClientRect(); if(r.width < 2 || r.height < 2) return false; const l = r.left - B.left, t = r.top - B.top; return b.r > l - 3 && b.l < l + r.width + 3 && b.b > t - 3 && b.t < t + r.height + 3; }); }});
}
// small wins / misses get a 1.2 s breather so quick answers aren't a wall of cheers; big ones and the ends always play
function cheerSay(kind, why){ if(!kind || !window.Cheer || !Cheer.active() || !G) return; const now = performance.now();
  if((kind === 'goal' || kind === 'miss') && (G.cheerAt || 0) > now - 1200) return; if(kind === 'big' && (G.cheerBig || 0) > now - 900) return;
  if(kind === 'goal' || kind === 'miss') G.cheerAt = now; if(kind === 'big') G.cheerBig = now; Cheer.react(kind, {side: 0}); }
function cheerEnd(won){ if(window.Cheer && Cheer.active()) Cheer.react(won ? 'win' : 'lose', {side: 0}); }
function cheerFaces(){ setTimeout(() => { const card = $('result-card'); if(!card || !window.Cheer || !Cheer.active() || card.querySelector('.cs-faces') || $('result').classList.contains('hidden')) return;
  const c = Cheer.faces(5, {h: 54}); if(!c) return; const cap = document.createElement('div'); cap.className = 'cs-faces-cap'; cap.textContent = '📣 Your cheer squad';
  const at = card.querySelector('.res-btns'); if(!at) return; at.parentNode.insertBefore(c, at); at.parentNode.insertBefore(cap, at); }, 900); }
/* 📣 CHEERSQUAD END */
function showResult(html){ $('result-card').innerHTML = html; $('result').classList.remove('hidden'); cheerFaces(); /* 📣 cs-4b */ }
function hideResult(){ $('result').classList.add('hidden'); }
function confetti(list, count){ for(let i = 0; i < (count || 24); i++){ const e = document.createElement('div'); e.className = 'confetti'; e.textContent = pick(list); e.style.left = Math.random() * 100 + 'vw'; e.style.animationDuration = (1.6 + Math.random() * 1.6) + 's'; e.style.animationDelay = (Math.random() * .5) + 's'; document.body.appendChild(e); setTimeout(() => e.remove(), 3800); } }
function sessionQuery(){ let q = ''; if(S.player || CURRENT_PLAYER) q += '&player=' + encodeURIComponent(S.player || CURRENT_PLAYER); if(SESSION_START) q += '&sessionStart=' + SESSION_START; if(DURATION_MIN) q += '&durationMin=' + DURATION_MIN; return q; }
function goGameroom(){ UI.back(WEBAPP_URL + '?page=gameroom' + sessionQuery(), 'rooms'); }   // 🧭 p1b: ◀ = where you came from (Gameroom if we don't know)

/* ================= BOOT ================= */
function boot(){
  UI.loading('math-quest');
  google.script.run.withSuccessHandler(d => {
      UI.loaded();
      S.players = d.players || []; S.progress = d.progress || {}; S.settings = d.settings || {}; S.avatars = d.avatars || {};
      UISound.applySettings(S.settings);
      const lockOn = !(S.settings.ScreenTimeLockEnabled === 'FALSE' || S.settings.ScreenTimeLockEnabled === false);
      lockHandle = UI.screenTimeLock({sessionStart: SESSION_START, durationMin: DURATION_MIN, enabled: lockOn, homeUrl: WEBAPP_URL + '?page=home', onLock: pauseGame});
      flushPending();
      if(CURRENT_PLAYER && S.players.some(p => p.Name === CURRENT_PLAYER)) choosePlayer(CURRENT_PLAYER); else { renderPlayers(); showScreen('player'); }
    }).withFailureHandler(() => { UI.loaded(); UI.toast('Could not load players — check the connection', 'err'); renderPlayers(); showScreen('player'); })
    .getLevelGameData(GAME_ID, CURRENT_PLAYER);
}
boot();
/* ✨ MODE SPOTLIGHT (modes-3): ?mode=<id> opens this game straight in that mode after the player pick · "✨ Also try" on the start page · started modes → UI.modeTried */
const MS_GAME = 'math-quest';
function msOpen(id){   // ➗ mq-w1: every live mode opens on the start page; ⏱️ Minute starts its race (or says why it's locked)
  const m = MODES.find(x => x.k === id); if(!m || m.soon) return;
  coverOff(); showScreen('menu');   /* 🧱 b3w6c: a mode link skips the cover */
  mode = id; savePrefs(); renderModes(); renderLevels();
  if(id !== 'minute') return; const c = document.querySelector('#scr-menu .lvl.challenge'); if(c){ if(c.scrollIntoView) c.scrollIntoView({block: 'center'}); c.click(); if(chosenLevel === 'c') startSetup(); }   /* 🧱 b3w6c: a tap only picks — ⏱️ still starts its race */
}
function msNow(){ return G && !G.over && G.mode ? G.mode : mode; }
function msWrap(fn, idOf){ const f = window[fn]; if(typeof f !== 'function') return; window[fn] = function(){ try{ const id = idOf.apply(this, arguments); if(id && UI.modeTried) UI.modeTried(S.player || CURRENT_PLAYER, MS_GAME, id); }catch(e){} return f.apply(this, arguments); }; }
function msAfter(fn, after){ const f = window[fn]; if(typeof f !== 'function') return; window[fn] = function(){ const r = f.apply(this, arguments); try{ after.apply(this, arguments); }catch(e){} return r; }; }
msWrap('startGame', x => x === 'c' ? 'minute' : (MODES.some(m => m.k === mode && !m.soon && m.k !== 'classic' && m.k !== 'minute') ? mode : ''));   // ➗ mq-w1
msAfter('choosePlayer', name => {
  if(!window.UI || !UI.modeLink) return;
  const id = UI.modeLink(MODE_LINK); if(id) msOpen(id);
  UI.alsoTry({game: MS_GAME, player: name, current: msNow, at: () => document.querySelector('#scr-menu .title'), open: msOpen});
});
/* ✨ END MODE SPOTLIGHT */

<script>/* 📏 p2: rows that used to scroll sideways → wrap + pages with dots (UiKit UI.pageRows) */ if (window.UI && UI.pageRows) { UI.pageRows('.chips', {rows: 3}); }/* ================= 🧑 YOUR AVATAR (p6e — ✨ P6 / 11w round 2) =================

const HAS_AV = typeof drawAvatar === 'function' && typeof GESTURES !== 'undefined';
const BD_SAY = {};

function bdStart(){
  BD.list.forEach(b => b && b.stop()); BD.list = []; BD.on = false;

  if(!HAS_AV || !UI.buddy || !window.Acting){ els.forEach(e => e.classList.add('hidden')); return; }

function bdResultBig(){ const big = document.querySelector('#result-card > .big'); if(!big || !BD.on) return; const won = !!document.querySelector('#result-card h2.cheer'); const c = document.createElement('canvas'); c.className = 'res-av'; c.id = 'res-av'; c.setAttribute('aria-hidden', 'true'); big.replaceWith(c); bdResult('res-av', won); }

<script>
/* 🎵 MOOD (24u-b) START — ✨ polish chat · UiKit ambient mood (UISound.mood, plan `Ambient Moods — full plan.md` §7). Don't edit by hand:
   Test Harness/patch_24ub_moods.py re-applies it. Starts with the game's cheerMount() (= play starts, also 🔄 Again), stops with
   cheerEnd() (result) or when the play screen goes away (◀ / 🎚️ Levels); every 0.4 s it reads the game's own state → tension /
   hush (🤖 thinking) / pause; the crowd's big moments → lift (max one every 3 s). Test hook: GMOOD (page global). */
const GMOOD = (function(){
  const ID = 'mathquest';
  function themeNow(){ try{ return String((function(){ return world; })() || ''); }catch(e){ return ''; } }   /* 🌍 24y-b: the theme / world → UISound.mood {theme} */
  let h = null, timer = 0, lastLift = 0;
  const vis = el => !!(el && el.getClientRects().length && getComputedStyle(el).visibility !== 'hidden');
  function playing(){ try{ return !!(G && !G.over) && vis(document.getElementById('scr-play')) && !vis(document.getElementById('result')); }catch(e){ return false; } }
  function skip(){ return false; }
  function tension(){ return G.limit ? 1 - timeLeft() / G.limit : 0; }
  function hush(){ return false; }
  function paused(){ return !!G.paused; }
  function poll(){
    if(!h || !h.live || !playing()){ stop(); return; }
    let t = 0; try{ t = Number(tension()) || 0; }catch(e){} h.tension(Math.min(1, Math.max(0, t)));
    let q = false; try{ q = !!hush(); }catch(e){} h.hush(q);
    let p = false; try{ p = !!paused(); }catch(e){} h.pause(p, 'game');
  }
  function start(){
    stop();
    try{ if(skip()) return; }catch(e){}
    try{ if(window.UISound && UISound.mood) h = UISound.mood(ID, {theme: themeNow()}); }catch(e){ h = null; }
    if(h && h.live){ timer = setInterval(poll, 400); setTimeout(poll, 80); } else h = null;
  }
  function lift(){ const now = Date.now(); if(!h || !h.live || now - lastLift < 3000) return; lastLift = now; try{ h.lift(); }catch(e){} }
  function stop(){ clearInterval(timer); timer = 0; const x = h; h = null; if(x){ try{ x.stop(); }catch(e){} } }
  function wrap(name, before){
    const f = window[name]; if(typeof f !== 'function' || f.__gmood) return;
    const w = function(){ try{ before.apply(this, arguments); }catch(e){} return f.apply(this, arguments); }; w.__gmood = 1; window[name] = w;
  }
  wrap('cheerMount', start);
  wrap('cheerEnd', stop);
  wrap('cheerSay', function(){ if((function(kind){ return kind === 'big'; }).apply(this, arguments)) lift(); });
  return {id: ID, themeNow: themeNow, start: start, stop: stop, lift: lift, poll: poll, now: () => h, playing: playing, tension: tension, hush: hush, paused: paused};
})();
/* 🎵 MOOD (24u-b) END */
</script>
